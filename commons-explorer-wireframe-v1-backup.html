<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Commons Explorer — Wireframe Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   COMMONS EXPLORER — LOW-FIDELITY WIREFRAME PROTOTYPE
   Grayscale, structure-first. No brand color, no decoration.
   ============================================================ */
:root{
  --ink:#171717; --ink-2:#383838; --ink-3:#7c7c7c; --ink-4:#999999;
  --line:#ededed; --line-2:#e2e2e2;
  --bg:#f7f7f8; --panel:#fff; --panel-2:#f8f8f8;
  --fill:#f3f3f3; --fill-2:#ededed; --active:#171717;
  --radius:8px; --radius-sm:6px; --maxw:1500px; --gap:22px;
  --shadow-sm:0 1px 2px rgba(15,15,15,.04);
  --shadow-md:0 4px 12px rgba(15,15,15,.06);
  --shadow-lg:0 12px 32px rgba(15,15,15,.10);
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5;letter-spacing:-.005em;font-feature-settings:'cv11','ss01','ss03';-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
a{color:inherit}img{max-width:100%}
.card,.panel,.doc-card,.hero,.filters,.dashtable,.qa,.accordion{box-shadow:var(--shadow-sm)}
[onclick]{cursor:pointer}
.ph-img[onclick]:hover,.video-ph[onclick]:hover{filter:brightness(.965)}

/* primitives */
.wf-note{font-size:11px;color:var(--ink-3);letter-spacing:.03em;text-transform:uppercase}
.ph-img{background:repeating-linear-gradient(45deg,transparent,transparent 9px,#e6e6e6 9px,#e6e6e6 10px),var(--fill);
  border:1px solid var(--line);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;
  color:var(--ink-3);font-size:12px;text-align:center;min-height:120px;padding:8px}
.ph-line{height:10px;background:var(--fill);border-radius:3px;margin:7px 0}
.ph-line.w90{width:90%}.ph-line.w80{width:80%}.ph-line.w60{width:60%}.ph-line.w40{width:40%}.ph-line.w30{width:30%}
.icon-box{width:34px;height:34px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel-2);display:inline-flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);padding:9px 15px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap;box-shadow:var(--shadow-sm);transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2,var(--panel-2));border-color:#d6d6d6}
.btn.primary{background:var(--active);color:#fff;border-color:var(--active)}
.btn.primary:hover{background:#000}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.link{border:none;background:none;padding:4px 0;text-decoration:underline;color:var(--ink)}
.btn.block{width:100%;justify-content:center}
.btn.btn-icon{padding:7px 9px;line-height:1}

/* layout */
.container{max-width:var(--maxw);margin:0 auto;padding:0 40px}
@media(max-width:1024px){.container{padding:0 28px}}
@media(max-width:600px){.container{padding:0 18px}}
header.site{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.nav{display:flex;align-items:center;gap:14px;height:60px}
.logo{border:none;padding:6px 0;font-weight:700;letter-spacing:.04em;cursor:pointer;font-size:13px;flex:0 0 auto;line-height:1.1}
.logo small{display:block;font-weight:400;font-size:9px;color:var(--ink-3);letter-spacing:.08em}
.nav ul{list-style:none;display:flex;gap:2px;margin:0;padding:0;flex:1 1 auto;flex-wrap:wrap}
.nav a.navlink{text-decoration:none;color:var(--ink-2);font-size:13px;padding:7px 8px;border-radius:var(--radius);cursor:pointer;display:inline-block}
.nav a.navlink:hover{background:var(--fill)}
.nav a.navlink.active{color:var(--ink);background:var(--fill-2);font-weight:600}

.crumbs{padding:12px 0;font-size:12px;color:var(--ink-3)}
.crumbs a{color:var(--ink-2);text-decoration:none;cursor:pointer}
.crumbs a:hover{text-decoration:underline}
.crumbs span.sep{margin:0 7px;color:var(--line)}
.crumbs span.here{color:var(--ink);font-weight:600}
main{min-height:60vh;padding-bottom:40px}

.section{padding:34px 0}
.section h2{font-size:20px;margin:0 0 4px}
.section .sub{color:var(--ink-2);margin:0 0 18px;max-width:720px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);margin-bottom:8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px}

.grid{display:grid;gap:var(--gap)}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.row{display:flex;gap:var(--gap);flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:15px}
.card p{margin:0;color:var(--ink-2);font-size:13px}
.card .cta{margin-top:auto}
.card.click{cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
.card.click:hover{transform:translateY(-2px);border-color:var(--ink-3);box-shadow:0 14px 28px -16px rgba(30,30,30,.3)}

.hero{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:34px;margin-top:18px}
.hero h1{font-size:30px;margin:0 0 12px;line-height:1.2}
.hero p.lead{font-size:16px;color:var(--ink-2);max-width:640px;margin:0 0 20px}

/* pathway */
.pathway{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.pw-step{flex:1 1 150px;min-width:130px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:11px 12px;cursor:pointer;transition:background .12s}
.pw-step:hover{background:var(--fill)}
.pw-step .num{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.pw-step .nm{font-size:13px;font-weight:600;margin-top:2px}
.pw-step.active{background:var(--active);border-color:var(--active)}
.pw-step.active .nm,.pw-step.active .num{color:#fff}
.pw-arrow{align-self:center;color:var(--line);font-size:16px}
.pw-flash{outline:2px solid var(--active);outline-offset:4px;border-radius:var(--radius);transition:outline-color .3s}
.chap-num{font-family:var(--mono);font-size:34px;font-weight:700;color:var(--line);line-height:1;margin-bottom:6px}
.pullquote{border-left:3px solid var(--ink);padding:6px 0 6px 18px;margin:4px 0;font-size:18px;line-height:1.5;color:var(--ink-2)}
.story-stat{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel-2);padding:14px 18px}
.story-stat b{font-family:var(--mono);font-size:30px;line-height:1}
.role-badge{font-size:11px;font-weight:600;border:1px solid var(--ink);border-radius:20px;padding:4px 10px;background:var(--fill-2);color:var(--ink);white-space:nowrap}
.profilew{position:relative}
.profilew-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:4px 11px 4px 5px;cursor:pointer;font:inherit;font-size:13px;color:var(--ink)}
.profilew-btn:hover{background:var(--fill)}
.pw-av{width:26px;height:26px;border-radius:50%;background:var(--active);color:#fff;display:inline-grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.pw-av.lg{width:44px;height:44px;font-size:15px}
.pw-name{font-weight:600}.pw-cv{color:var(--ink-3);font-size:11px}
.profilew.open .pw-cv{transform:rotate(180deg)}
.profilew-menu{position:absolute;right:0;top:calc(100% + 8px);width:232px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 16px 40px -12px rgba(30,30,30,.4);padding:6px;display:none;z-index:60}
.profilew.open .profilew-menu{display:block}
/* apps launcher */
.appsw{position:relative;display:inline-flex}
.appsw-menu{position:absolute;right:0;top:calc(100% + 10px);width:440px;max-width:92vw;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 48px -14px rgba(30,30,30,.45);padding:18px 18px 20px;display:none;z-index:60}
.appsw.open .appsw-menu{display:block}
.appsw-cols{display:grid;grid-template-columns:2fr 1fr;gap:22px}
.appsw-h{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px}
.app-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 6px}
.app-grid1{display:grid;grid-template-columns:1fr;gap:14px}
.app-tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 4px;border-radius:10px;cursor:pointer;text-align:center;border:1px solid transparent}
.app-tile:hover{background:var(--fill)}
.app-ic{width:48px;height:48px;border-radius:13px;background:var(--fill);border:1px solid var(--line-2);display:grid;place-items:center;font-size:21px}
.app-nm{font-size:12px;font-weight:600;color:var(--ink)}
@media(max-width:560px){.appsw-cols{grid-template-columns:1fr}}
/* account pages: left-side nav */
.acct-nav{display:flex;flex-direction:column;gap:4px;position:sticky;top:88px}
.acct-nav .acct-h{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:0 12px 8px}
.acct-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:var(--radius-sm);font-size:13.5px;color:var(--ink-2);cursor:pointer;border:1px solid transparent}
.acct-item:hover{background:var(--fill)}
.acct-item.active{background:var(--active);color:#fff;font-weight:600}
.acct-item .acct-ic{font-size:15px;flex:none}
@media(max-width:760px){.acct-nav{position:static;flex-direction:row;flex-wrap:wrap}.acct-grid{grid-template-columns:1fr!important}}
.pw-head{display:flex;align-items:center;gap:10px;padding:8px}
.pw-head b{display:block;font-size:14px}.pw-head span{font-size:11px;color:var(--ink-3)}
.pw-div{height:1px;background:var(--line-2);margin:5px 0}
.pw-item{display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;padding:9px;border-radius:6px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;text-align:left}
.pw-item:hover{background:var(--fill)}
.pw-ic{width:18px;text-align:center}
.pw-item.danger{color:#8a1f1f}
.role-opt{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;cursor:pointer;background:var(--panel);transition:background .12s}
.role-opt:hover{background:var(--fill)}
.role-opt .ro-tx b{display:block;font-size:13px}
.role-opt .ro-tx span{font-size:11px;color:var(--ink-3)}
.role-opt .ra{font-size:12px;color:var(--ink-2);white-space:nowrap}

/* resource card */
.rcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:9px}
.rcard .rc-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.rcard h4{margin:0;font-size:14px;line-height:1.35}
.rcard .purpose{color:var(--ink-2);font-size:12.5px;margin:0}
.meta-tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;border:1px solid var(--line);border-radius:20px;padding:2px 9px;background:var(--panel-2);color:var(--ink-2);white-space:nowrap}
.tag.solid{background:var(--fill-2);border-color:var(--fill-2)}
.rc-actions{display:flex;gap:8px;margin-top:2px}
.rc-type-chip{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);border:1px dashed var(--line);border-radius:3px;padding:2px 6px}

/* filter sidebar */
.layout-side{display:grid;grid-template-columns:250px 1fr;gap:24px;align-items:start}
.filters{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;position:sticky;top:76px}
.fgroup{border-bottom:1px solid var(--line-2);padding:12px 0}
.fgroup:first-child{padding-top:0}
.fgroup h4{margin:0 0 9px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2)}
.fopt{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);padding:3px 0;cursor:pointer}
.fopt input{accent-color:var(--ink)}
.filter-actions{display:flex;gap:8px;margin-top:14px}

/* search bar */
.searchfield{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);padding:11px 14px}
.searchfield input{border:none;outline:none;flex:1;font-size:14px;background:transparent}
.searchfield .icon-box{width:28px;height:28px;font-size:14px}

/* flow diagram */
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.flow .node{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);padding:10px 14px;font-size:13px;text-align:center;min-width:96px}
.flow .node.strong{border-width:1.5px;font-weight:600}
.flow .node .sub2{font-family:var(--mono);font-size:10px;color:var(--ink-3);display:block;margin-top:2px}
.flow .arw{color:var(--ink-3);font-size:15px}

/* qa / accordion */
.qa{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);overflow:hidden}
.qa .qitem{border-bottom:1px solid var(--line-2)}
.qa .qitem:last-child{border-bottom:none}
.qa .qq{padding:13px 16px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:14px}
.qa .qq:hover{background:var(--panel-2)}
.qa .qa-body{padding:0 16px 14px;color:var(--ink-2);font-size:13px}

.ctx-row{border:1px solid var(--line-2);border-radius:var(--radius);padding:12px 14px;background:var(--panel)}
.ctx-row h5{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3)}
.ctx-row p{margin:0;color:var(--ink-2);font-size:13px}
.callout{border:1.5px solid var(--ink);border-radius:var(--radius);background:var(--panel-2);padding:16px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.callout .txt strong{display:block;font-size:14px}
.callout .txt span{font-size:13px;color:var(--ink-2)}
.video-ph{position:relative;min-height:150px}
.video-ph .play{width:52px;height:52px;border-radius:50%;border:2px solid var(--ink-3);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink-3)}
.reveal{border:1px solid var(--line-2);border-top:none;border-radius:0 0 var(--radius) var(--radius);background:var(--panel-2);padding:14px;font-size:13px;color:var(--ink-2)}
.hidden{display:none}

/* extra wireframe bits */
.wf-label{font-size:12px;color:var(--ink-2);font-weight:600;margin:0 0 6px;display:block}
.wf-field{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:10px 12px;color:var(--ink-3);font-size:13px;display:flex;align-items:center;gap:8px}
.wf-in{width:100%;border:1px solid var(--line-2);border-radius:var(--radius-sm);background:var(--panel);padding:10px 12px;font:inherit;font-size:13px;color:var(--ink)}
.wf-in::placeholder{color:var(--ink-4)}
.wf-in:focus{outline:none;border-color:var(--ink-3);box-shadow:0 0 0 3px rgba(23,23,23,.06)}
textarea.wf-in{min-height:74px;resize:vertical}
select.wf-in{cursor:pointer}
.wf-field.area{min-height:64px;align-items:flex-start}
.field-block{margin-bottom:14px}
.stepbar{display:flex;gap:6px;margin-bottom:18px}
.stepbar i{flex:1;height:5px;background:var(--fill);border-radius:3px}
.stepbar i.on{background:var(--active)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line-2);padding-bottom:10px;margin-bottom:16px}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:6px 12px;font-size:12px;cursor:pointer}
.tab:hover{background:var(--fill)}
.tab.active{background:var(--active);color:#fff;border-color:var(--active)}
.stat{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:14px}
.stat b{font-size:24px;display:block}
.stat span{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.split{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--panel)}
.split .sl{padding:26px}.split .sr{background:var(--panel-2);padding:26px;display:flex;flex-direction:column;gap:12px;justify-content:center}
.dropdown{position:relative}
.dropdown-menu{position:absolute;left:0;right:0;top:calc(100% + 5px);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 14px 34px -10px rgba(30,30,30,.3);padding:5px;display:none;z-index:30}
.dropdown.open .dropdown-menu{display:block}
.dd-opt2{padding:8px 10px;border-radius:5px;font-size:13px;cursor:pointer;color:var(--ink)}
.dd-opt2:hover{background:var(--fill)}
/* approval workflow timeline + status tabs (ref: DMS admin flow) */
.wf-tl{display:flex;flex-direction:column}
.wf-ev{display:flex;gap:12px;position:relative;padding-bottom:18px}
.wf-ev:last-child{padding-bottom:0}
.wf-ev .wf-ic{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:13px;z-index:1}
.wf-ev.done .wf-ic{background:var(--ink);color:#fff;border-color:var(--ink)}
.wf-ev.pending .wf-ic{border-style:dashed;color:var(--ink-3)}
.wf-ev:not(:last-child)::before{content:"";position:absolute;left:14px;top:30px;bottom:0;width:1px;background:var(--line-2)}
.wf-ev .wf-lb{font-weight:600;font-size:14px}
.wf-ev.pending .wf-lb{color:var(--ink-2)}
.wf-ev .wf-mt{font-size:12px;color:var(--ink-3)}
.tabs-c{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line-2);padding-bottom:10px;margin:14px 0 16px}
.tab-c{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;color:var(--ink)}
.tab-c:hover{background:var(--fill)}
.tab-c.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab-c .cnt{background:var(--fill);border-radius:999px;padding:0 7px;font-size:11px;font-weight:700;color:var(--ink-2)}
.tab-c.active .cnt{background:rgba(255,255,255,.22);color:#fff}
.sub-row{cursor:pointer}
.sub-row:hover{background:var(--panel-2)}
.detail-f{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line-2);font-size:13px}
.detail-f:first-child{border-top:0}
.detail-f .k{color:var(--ink-3)}
.detail-f .v{color:var(--ink);font-weight:500;text-align:right}
/* document cards + viewer (ref: DMS document grid) */
.doc-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column}
.doc-top{display:flex;align-items:center;gap:10px}
.doc-fi{flex:none;width:34px;height:34px;border-radius:7px;background:var(--ink);color:#fff;display:grid;place-items:center}
.doc-name{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-more{flex:none;width:28px;height:28px;border:0;background:none;border-radius:6px;cursor:pointer;color:var(--ink-3);font-size:16px;line-height:1}
.doc-more:hover{background:var(--fill)}
.doc-prev{border:1px solid var(--line-2);border-radius:var(--radius);background:var(--panel-2);padding:16px;margin:12px 0;min-height:150px;cursor:pointer;overflow:hidden}
.doc-prev:hover{border-color:var(--line)}
.doc-foot{display:flex;align-items:center;gap:9px;padding-top:12px;border-top:1px solid var(--line-2)}
.doc-editing{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-3);padding-top:10px}
.doc-editing .edot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.detail-blk{padding:14px 0;border-top:1px solid var(--line-2)}
.detail-blk:first-of-type{border-top:0;padding-top:0}

.lpin{position:absolute;z-index:2;display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);
  border-radius:9px;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--ink);box-shadow:0 5px 14px -5px rgba(0,0,0,.35);cursor:pointer;white-space:nowrap}

.lc-ill{display:grid;place-items:center;height:120px;border-radius:8px;background:var(--fill);border:1px solid var(--line-2);margin-bottom:10px;overflow:hidden}

.sig-map{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--panel)}

.sig-zoom{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:4px}

.sig-legend{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-top:1px solid var(--line-2)}

.sig-side{background:var(--active);color:#fff;border-radius:var(--radius);padding:18px}

.sig-metric-val{display:block;font-size:38px;font-weight:800;line-height:1.1;margin:4px 0}
.sig-metric-unit{display:block;font-size:12px;color:rgba(255,255,255,.75)}
.sig-rank{margin:0;padding-left:20px}

.sig-hint{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 16px}
.sig-hint .h{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2);background:var(--panel);border:1px solid var(--line-2);border-radius:20px;padding:5px 12px}

.tag.sigst{cursor:pointer}
/* significance: filterable map */
.sig-filters{display:flex;flex-direction:column;gap:6px}
.sig-fgroup{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:6px 0 2px}
.sig-fbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line-2);background:var(--panel);border-radius:var(--radius-sm);padding:10px 12px;font:inherit;font-size:13px;color:var(--ink-2);cursor:pointer;transition:background .12s,border-color .12s}

.sig-hero-badge{position:absolute;top:10px;left:10px;background:var(--active);color:#fff;font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;z-index:2}
.tag.sigst.active{background:var(--active);color:#fff;border-color:var(--active)}

footer.site{background:var(--panel);border-top:1px solid var(--line);margin-top:20px}

.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}

@media(max-width:1000px){.g4,.g5,.g3{grid-template-columns:repeat(2,1fr)}.layout-side{grid-template-columns:1fr}.filters{position:static}.kanban{grid-template-columns:1fr 1fr}footer.site .cols{grid-template-columns:1fr 1fr}}

#proto-hint{position:fixed;bottom:12px;right:12px;z-index:50;background:var(--active);color:#fff;font-size:11px;padding:7px 12px;border-radius:20px;opacity:.85;cursor:pointer}

/* ============================================================
   COMMONS EXPLORER — additions on top of the shared wireframe kit
   ============================================================ */
/* carousel (homepage + thematic map carousel) */
.carousel{position:relative;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);overflow:hidden}
.car-track{display:flex;transition:transform .35s ease}
.car-slide{flex:0 0 100%;position:relative}
.car-stage{min-height:480px;border:none;border-radius:0}
@media(max-width:1000px){.car-stage{min-height:380px}}
@media(max-width:640px){.car-stage{min-height:280px}}
.car-cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(to top,rgba(23,23,23,.78),rgba(23,23,23,0));color:#fff;padding:52px 28px 22px}
.car-cap b{display:block;font-size:19px;font-weight:700}
.car-cap span{font-size:13.5px;color:rgba(255,255,255,.84)}
.car-nav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.94);cursor:pointer;font-size:15px;color:var(--ink);display:grid;place-items:center;z-index:3}
.car-nav:hover{background:#fff}
.car-nav.prev{left:12px}.car-nav.next{right:12px}
.car-dots{display:flex;gap:7px;justify-content:center;padding:11px 0;border-top:1px solid var(--line-2);background:var(--panel)}
.car-dot{width:8px;height:8px;border-radius:50%;background:var(--line-2);border:0;padding:0;cursor:pointer}
.car-dot.on{background:var(--active);width:22px;border-radius:5px}
.car-auto{position:absolute;top:10px;right:12px;z-index:3;font-size:10px;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:20px;padding:3px 9px;color:var(--ink-3)}

/* home page title */
.home-title{font-size:42px;line-height:1.12;letter-spacing:-.02em;margin:0 0 14px;font-weight:800}
@media(max-width:1000px){.home-title{font-size:34px}}
@media(max-width:640px){.home-title{font-size:27px}}

/* module tiles (home: 4 modules) */
.mod-tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
.mod-tile:hover{transform:translateY(-2px);border-color:var(--ink-3);box-shadow:0 14px 28px -16px rgba(30,30,30,.3)}
.mod-ic{width:46px;height:46px;border-radius:12px;border:1px solid var(--line-2);background:var(--fill);display:grid;place-items:center;font-size:22px}
.mod-tile h3{margin:0;font-size:16px}
.mod-tile p{margin:0;font-size:13px;color:var(--ink-2)}
.mod-tile .sub-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}

/* staged carousel (thematic lens — carousel view) */
.car-stage3{display:flex;gap:20px;align-items:flex-end;justify-content:center;padding:26px 30px 8px;background:var(--panel-2)}
.car-pane{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center}
.car-shot{width:100%;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s}
.car-shot:hover{transform:translateY(-3px);box-shadow:0 16px 34px -18px rgba(30,30,30,.42)}
.car-shot .cs-bar{display:flex;align-items:center;gap:5px;padding:6px 9px;border-bottom:1px solid var(--line-2);background:var(--panel-2)}
.car-shot .cs-bar i{width:7px;height:7px;border-radius:50%;background:var(--line-2);display:block}
.car-shot .cs-bar span{margin-left:6px;font-size:10px;color:var(--ink-3);letter-spacing:.03em}
.car-shot .ph-img{border:none;border-radius:0}
.car-pane:nth-child(1) .ph-img{min-height:168px}
.car-pane:nth-child(2) .ph-img{min-height:196px}
.car-pane:nth-child(3) .ph-img{min-height:224px}
.car-pill{margin-top:-16px;position:relative;z-index:2;background:var(--active);color:#fff;border-radius:24px;padding:9px 20px;font-size:13px;font-weight:600;text-align:center;box-shadow:0 6px 16px -8px rgba(0,0,0,.5)}
.car-sub{font-size:11px;color:var(--ink-3);margin-top:7px;text-align:center}
.car-pane:only-child{max-width:880px;margin:0 auto}
.car-pane:only-child .ph-img{min-height:330px}
@media(max-width:820px){.car-stage3{flex-direction:column;align-items:stretch}.car-pane .ph-img,.car-pane:nth-child(1) .ph-img,.car-pane:nth-child(2) .ph-img,.car-pane:nth-child(3) .ph-img{min-height:150px}}

/* LCAP — map viewer layer panel, vertical toolbar, stage tracker */
.lyr{display:flex;align-items:center;gap:8px;padding:8px 9px;border:1px solid var(--line-2);border-radius:4px;margin-bottom:5px;background:var(--panel);font-size:12.5px;color:var(--ink-2);cursor:pointer}
.lyr:hover{background:var(--fill)}
.lyr.on{background:var(--fill-2);border-color:var(--ink-3);color:var(--ink);font-weight:500}
.lyr .gr{color:var(--ink-4);font-size:11px;letter-spacing:-1px}
.lyr .cb{width:13px;height:13px;border:1px solid var(--ink-3);border-radius:2px;display:grid;place-items:center;font-size:10px;color:#fff;flex:none}
.lyr.on .cb{background:var(--ink);border-color:var(--ink)}
.lyr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lyr-tools{display:flex;gap:4px;background:var(--ink-2);border-radius:var(--radius-sm);padding:5px;margin:8px 0 10px}
.lyr-tools button{width:26px;height:26px;border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:4px;cursor:pointer;font-size:12px}
.lyr-tools button:hover{background:rgba(255,255,255,.28)}
.lyr-tools .sp{margin-left:auto;background:none;color:var(--ink-4)}
.mw-vtools{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:5px;z-index:3}
.mw-vtools button{width:30px;height:30px;border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:6px;cursor:pointer;font-size:13px;display:grid;place-items:center;color:var(--ink-2)}
.mw-vtools button:hover{background:#fff;color:var(--ink)}
.mw-vtools .grp{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--active)}
.mw-vtools .grp button{border:0;border-radius:0;background:var(--active);color:#fff;border-bottom:1px solid rgba(255,255,255,.2)}
.mw-vtools .grp button:last-child{border-bottom:0}
.mw-locate{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 12px;font-size:12.5px;color:var(--ink-3);width:min(420px,60%)}
.mw-mini{position:absolute;bottom:12px;left:12px;width:96px;height:70px;border:1px solid var(--line);background:var(--panel-2);z-index:3;border-radius:4px}
.lcap{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);overflow:hidden}
.lcap-h{padding:10px 13px;font-size:12px;font-weight:700;letter-spacing:.04em;background:var(--fill-2);border-bottom:1px solid var(--line-2);border-top:1px solid var(--line-2)}
.lcap-block:first-child .lcap-h{border-top:0}
.lcap-row{display:grid;grid-template-columns:repeat(5,1fr)}
.lcap-step{padding:13px;font-size:12px;line-height:1.5;color:var(--ink-2);border-left:1px solid var(--line-2);min-height:104px;cursor:pointer}
.lcap-step:first-child{border-left:0}
.lcap-step:hover{background:var(--panel-2)}
.lcap-step b{display:block;font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-bottom:5px}
.lcap-step.done b{color:var(--ink)}
.lcap-step.done{background:var(--panel-2)}

.mw-main{position:relative;display:flex;flex-direction:column}
.mw-toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:9px 12px;border-bottom:1px solid var(--line-2);background:var(--panel)}
.mw-tool{border:1px solid var(--line-2);background:var(--panel);border-radius:var(--radius-sm);padding:6px 10px;font-size:12px;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.mw-tool:hover{background:var(--fill)}
.mw-tool.on{background:var(--active);color:#fff;border-color:var(--active)}
.mw-canvas{flex:1;position:relative;min-height:400px;border:none;border-radius:0}
.mw-float{position:absolute;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:var(--radius-sm);font-size:12px;color:var(--ink-2)}
.mw-float.zoom{top:12px;left:12px;display:flex;flex-direction:column;padding:0;overflow:hidden}
.mw-float.zoom button{width:28px;height:28px;border:0;border-bottom:1px solid var(--line-2);background:none;cursor:pointer;font-size:15px;line-height:1;color:var(--ink)}
.mw-float.zoom button:last-child{border-bottom:0}
.mw-float.scalebar{bottom:12px;left:12px;padding:5px 9px;letter-spacing:.04em}
.mw-float.coords{bottom:12px;right:12px;padding:5px 9px;font-family:var(--mono);font-size:11px}
.mw-h{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 8px}
.mw-h:first-child{margin-top:0}
.layer{display:flex;align-items:center;gap:9px;padding:7px 8px;border:1px solid transparent;border-radius:var(--radius-sm);font-size:12.5px;color:var(--ink-2);cursor:pointer}
.layer:hover{background:var(--fill)}
.layer .sw{width:13px;height:13px;border-radius:3px;border:1px solid var(--line-2);background:var(--fill-2);flex:none}
.layer .tog{margin-left:auto;width:28px;height:16px;border-radius:9px;background:var(--fill-2);border:1px solid var(--line-2);position:relative;flex:none}
.layer.on .tog{background:var(--active);border-color:var(--active)}
.layer.on .tog::after{left:13px}
.layer .tog::after{content:"";position:absolute;top:1px;left:1px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .14s}
.layer.on{color:var(--ink);font-weight:500}
@media(max-width:900px){.mapwork,.mapwork.three{grid-template-columns:1fr}.mw-side{border-right:none;border-bottom:1px solid var(--line-2)}.mw-side.right{border-left:none;border-top:1px solid var(--line-2)}}

/* indicator tiles / dashboards */
.kpi{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:13px 14px}
.kpi .k{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.kpi b{display:block;font-family:var(--mono);font-size:22px;font-weight:700;line-height:1.25;margin-top:3px}
.kpi .d{font-size:11.5px;color:var(--ink-3)}
.chart-ph{border:1px solid var(--line-2);border-radius:var(--radius);background:var(--panel);padding:14px}
.chart-ph .ct{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:600;margin-bottom:12px}
.chart-ph .ct span{font-weight:400;font-size:11px;color:var(--ink-3)}
.bars{display:flex;align-items:flex-end;gap:9px;height:132px}
.bars i{flex:1;background:var(--fill-2);border:1px solid var(--line-2);border-bottom:none;border-radius:3px 3px 0 0;display:block}
.bars i.dark{background:#c9c9c9}
.axis{display:flex;gap:9px;border-top:1px solid var(--line-2);padding-top:6px;margin-top:0}
.axis span{flex:1;text-align:center;font-size:10px;color:var(--ink-3)}
.linechart{height:132px;border-left:1px solid var(--line-2);border-bottom:1px solid var(--line-2);position:relative;overflow:hidden}
.donut{width:126px;height:126px;border-radius:50%;background:conic-gradient(#2b2b2b 0 38%,#9a9a9a 38% 62%,#c9c9c9 62% 84%,#e6e6e6 84% 100%);margin:0 auto;position:relative}
.donut::after{content:"";position:absolute;inset:26%;border-radius:50%;background:var(--panel)}

/* access + status chips */
.chip-lock{font-size:10.5px;border-radius:20px;padding:2px 9px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink-2);white-space:nowrap}
.chip-lock.pub{border-style:solid}
.chip-lock.priv{border-style:dashed;color:var(--ink-3)}
.chip-lock.solid{background:var(--active);color:#fff;border-color:var(--active)}

/* dataset row (repository list view) */
.ds-row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:13px 12px;border-top:1px solid var(--line-2);cursor:pointer}
.ds-row:first-child{border-top:none}
.ds-row:hover{background:var(--panel-2)}
.ds-ic{width:38px;height:38px;border-radius:8px;border:1px solid var(--line-2);background:var(--fill);display:grid;place-items:center;font-size:17px}
.ds-t{font-size:14px;font-weight:600;margin:0 0 3px}
.ds-m{font-size:11.5px;color:var(--ink-3)}

/* gallery card */
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .15s,box-shadow .15s}
.gcard:hover{transform:translateY(-2px);box-shadow:0 14px 28px -16px rgba(30,30,30,.3)}
.gcard .gth{min-height:150px;border:none;border-radius:0;border-bottom:1px solid var(--line-2)}
.gcard .gbody{padding:13px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.gcard h4{margin:0;font-size:14px;line-height:1.35}
.gcard .gm{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-3);margin-top:auto;padding-top:8px;border-top:1px solid var(--line-2)}

/* url / share bar */
.urlbar{display:flex;align-items:center;gap:10px;border:1px solid var(--line-2);border-radius:var(--radius-sm);background:var(--panel-2);padding:9px 12px;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);overflow:auto;white-space:nowrap}

/* step / wizard for AI report */
.aibox{border:1.5px dashed var(--line-2);border-radius:var(--radius);background:var(--panel-2);padding:16px}
.ailine{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.ai-av{width:26px;height:26px;border-radius:7px;background:var(--active);color:#fff;display:grid;place-items:center;font-size:12px;flex:none}

/* mini table */
.mtable{width:100%;border-collapse:collapse;font-size:12.5px}
.mtable th{text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.mtable td{padding:10px;border-bottom:1px solid var(--line-2);color:var(--ink-2);vertical-align:middle}
.mtable tr:last-child td{border-bottom:none}
.mtable td b{color:var(--ink);font-weight:600}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}

/* language switcher */
.langw{position:relative;display:inline-flex}
.lang-menu{position:absolute;right:0;top:calc(100% + 8px);width:158px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 16px 40px -12px rgba(30,30,30,.4);padding:6px;display:none;z-index:60}
.langw.open .lang-menu{display:block}

/* sitemap tree */
.tree{font-family:var(--mono);font-size:12px;color:var(--ink-2);line-height:2;white-space:pre;overflow-x:auto}
.tree a{color:var(--ink);cursor:pointer;text-decoration:none;border-bottom:1px dotted var(--line-2)}
.tree a:hover{background:var(--fill)}

/* comparison split */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){.compare{grid-template-columns:1fr}}
.legend-sw{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-2)}
.legend-sw i{width:14px;height:14px;border-radius:3px;border:1px solid var(--line-2);display:inline-block}

/* ============================================================
   VISUAL POLISH LAYER — refines the kit without changing structure
   ============================================================ */
:root{
  --ink:#141414; --ink-2:#454545; --ink-3:#767676; --ink-4:#a1a1a1;
  --line:#e8e8e8; --line-2:#dedede;
  --bg:#f6f6f7; --panel:#fff; --panel-2:#fafafa;
  --fill:#f2f2f2; --fill-2:#eaeaea;
  --radius:10px; --radius-sm:8px; --gap:20px;
  --shadow-sm:0 1px 2px rgba(20,20,20,.04);
  --shadow-md:0 6px 18px -8px rgba(20,20,20,.10);
  --shadow-lg:0 18px 44px -18px rgba(20,20,20,.22);
}
body{font-size:14.5px;line-height:1.55;letter-spacing:-.008em}

/* type scale */
h1,h2,h3,h4,h5{letter-spacing:-.018em}
.section{padding:40px 0}
.section h2{font-size:22px;line-height:1.25;margin:0 0 6px}
.section .sub{color:var(--ink-2);font-size:14.5px;line-height:1.6;max-width:760px;margin:0 0 20px}
.eyebrow{font-size:10.5px;letter-spacing:.12em;color:var(--ink-3);margin-bottom:10px;font-weight:600}
.wf-note{font-size:10.5px;letter-spacing:.06em;color:var(--ink-3)}
.home-title{letter-spacing:-.028em}

/* header */
header.site{backdrop-filter:saturate(180%) blur(8px);background:rgba(255,255,255,.88);border-bottom:1px solid var(--line)}
.nav{height:64px;gap:18px}
.logo{font-size:13.5px;letter-spacing:.06em}
.logo small{letter-spacing:.14em;font-size:8.5px;margin-top:2px}
.nav a.navlink{font-size:13.5px;padding:8px 11px;border-radius:8px;transition:background .14s,color .14s}
.nav a.navlink.active{background:var(--ink);color:#fff}
.nav a.navlink.active:hover{background:var(--ink)}

/* surfaces */
.card,.panel,.rcard,.doc-card,.hero,.filters,.qa,.gcard,.kpi,.chart-ph,.ctx-row,.tblwrap,.region-card,.ve-card,.mapwork,.carousel,.gnv,.sup,.mae,.gn-side,.gn-row,.mod-tile,.lens{border-color:var(--line)}
.panel,.card{border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.panel{padding:22px}
.card{padding:18px;gap:11px}
.card h3{font-size:15.5px;letter-spacing:-.015em}
.card p{font-size:13.5px;line-height:1.6}
.card.click:hover,.mod-tile:hover,.lens:hover,.gcard:hover,.rescard:hover,.gnc:hover,.gn-row:hover{box-shadow:var(--shadow-md);border-color:var(--line-2)}

/* buttons */
.btn{padding:10px 16px;border-radius:9px;font-size:13.5px;font-weight:500;transition:background .14s,border-color .14s,transform .1s,box-shadow .14s}
.btn:active{transform:translateY(1px)}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:8px}
.btn.primary{box-shadow:0 2px 8px -2px rgba(20,20,20,.35)}
.btn.primary:hover{background:#000;box-shadow:0 4px 14px -4px rgba(20,20,20,.45)}
.btn:focus-visible,.wf-in:focus-visible,select:focus-visible,input:focus-visible,.navlink:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* pills & chips */
.tag,.chip,.chip-lock,.rc-type-chip{border-radius:999px;font-size:11.5px;padding:4px 11px;letter-spacing:.005em}
.tag.solid{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab-c{padding:7px 14px}
.role-badge{padding:5px 12px}

/* placeholders — lighter, calmer hatch */
.ph-img{background:repeating-linear-gradient(45deg,transparent,transparent 10px,#ececec 10px,#ececec 11px),#f7f7f7;
  border:1px dashed var(--line-2);border-radius:var(--radius);color:var(--ink-4);font-size:12px;letter-spacing:.01em}
.ph-img.car-stage,.ph-img.mw-canvas,.ph-img.gth,.ph-img.rth,.ph-img.sheet-map,.ph-img.ve-map,.ph-img.gn-th{border-style:solid;border-color:var(--line)}

/* form fields */
.wf-in,select.wf-in{border-radius:9px;padding:11px 13px;font-size:13.5px;border-color:var(--line-2);transition:border-color .14s,box-shadow .14s}
.wf-in:focus{border-color:var(--ink-3);box-shadow:0 0 0 3px rgba(20,20,20,.05)}
.wf-label{font-size:12.5px;margin-bottom:7px}
.searchfield{border-radius:12px;padding:13px 16px;border-color:var(--line-2)}

/* metrics & tables */
.kpi{border-radius:var(--radius);padding:15px 16px}
.kpi b{font-size:23px;letter-spacing:-.02em}
.kpi .k{font-size:10px;letter-spacing:.1em}
.mtable th{font-size:10px;letter-spacing:.1em;padding:10px 12px}
.mtable td{padding:11px 12px;font-size:13px}
.mtable tbody tr:nth-child(even) td{background:var(--panel-2)}
.tblwrap{border-radius:var(--radius)}
.stat b{letter-spacing:-.02em}

/* module + lens tiles */
.mod-tile{border-radius:14px}
.mod-tile.lg{padding:30px 32px}
.mod-tile.lg h3{font-size:21px}
.mod-ic{border-radius:14px;background:var(--panel-2)}
.lens{border-radius:14px;padding:26px 20px}
.lens .lens-ic{border-color:var(--line-2);background:var(--panel-2)}

/* carousel */
.carousel{border-radius:14px}
.car-nav{width:38px;height:38px;box-shadow:var(--shadow-md);border-color:var(--line-2)}
.car-dots{padding:13px 0}
.car-dot{transition:width .2s,background .2s}
.car-auto{letter-spacing:.09em;font-size:9.5px;color:var(--ink-4)}
.car-pill{border-radius:999px;padding:10px 22px;font-size:13.5px;box-shadow:0 8px 20px -10px rgba(0,0,0,.55)}

/* gallery / results cards */
.gcard,.rescard,.gnc{border-radius:12px}
.gcard h4,.rescard h4{letter-spacing:-.012em}
.gn-row{border-radius:12px}
.gn-body h4{font-size:15.5px}

/* map workspaces */
.mapwork,.ve-stage,.gnv,.sup,.mae{border-radius:14px;box-shadow:var(--shadow-sm)}
.mw-toolbar{padding:10px 14px}
.mw-tool{border-radius:8px;padding:7px 11px}
.mw-side{padding:16px}
.mw-h{font-size:10px;letter-spacing:.11em}
.layer{border-radius:8px}

/* atlas sheets */
.sheet{border-radius:8px;border-color:var(--line-2);box-shadow:var(--shadow-sm)}
.sheet:hover{box-shadow:var(--shadow-md)}

/* callouts */
.callout{border-radius:12px;border-width:1px;border-color:var(--ink-3);padding:18px 20px}
.callout .txt strong{font-size:14.5px;margin-bottom:2px}
.ctx-row{border-radius:10px;padding:14px 16px}

/* footer */
footer.site{margin-top:32px}
footer.site .cols{padding:36px 0}
footer.site li{padding:5px 0;font-size:13.5px;transition:color .12s}
footer .bar{padding:16px 0}

/* misc */
.overlay{backdrop-filter:blur(2px)}
.searchpanel{border-radius:14px;border-color:var(--line-2);box-shadow:var(--shadow-lg);padding:24px}
.modal-card{border-radius:14px}
::selection{background:var(--ink);color:#fff}
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:6px}
*::-webkit-scrollbar-thumb:hover{background:var(--ink-4)}
*::-webkit-scrollbar-track{background:transparent}

.crumbs{padding:18px 0 2px;font-size:12.5px;display:flex;flex-wrap:wrap;align-items:center}
.crumbs a{color:var(--ink-3);text-decoration:none;cursor:pointer;padding:2px 0;transition:color .12s}
.crumbs a:hover{color:var(--ink);text-decoration:underline}
.crumbs span.sep{margin:0 9px;color:var(--line-2)}
.crumbs span.here{color:var(--ink);font-weight:600}

/* blog article */
.art{max-width:760px}
.art-lead{font-size:17px;line-height:1.65;color:var(--ink-2);margin:0 0 22px}
.art p{font-size:15px;line-height:1.75;color:var(--ink-2);margin:0 0 18px}
.art h3{font-size:19px;margin:32px 0 12px}
.art h4{font-size:15.5px;margin:24px 0 10px}
.art ul{margin:0 0 18px;padding-left:22px}
.art li{font-size:15px;line-height:1.75;color:var(--ink-2);margin:7px 0}
.art figure{margin:26px 0}
.art figcaption{font-size:12px;color:var(--ink-3);margin-top:9px;line-height:1.55}
.art blockquote{margin:26px 0;padding:4px 0 4px 22px;border-left:3px solid var(--ink);font-size:19px;line-height:1.55;color:var(--ink);font-weight:500}
.art-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 0;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2);margin:0 0 26px}
.art-meta .who{font-size:13.5px;color:var(--ink)}
.art-meta .when{font-size:12.5px;color:var(--ink-3)}
.art-toc{position:sticky;top:88px}
.art-toc .h{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:10px}
.art-toc a{display:block;font-size:13px;color:var(--ink-2);padding:7px 0 7px 12px;border-left:2px solid var(--line-2);cursor:pointer}
.art-toc a:hover{color:var(--ink);border-left-color:var(--ink-3)}
.art-toc a.on{color:var(--ink);font-weight:600;border-left-color:var(--ink)}
.art-tags{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0}
@media(max-width:900px){.art-toc{position:static;margin-bottom:20px}}

/* sign-in modal */
#login-modal{position:fixed;inset:0;z-index:95;display:none}
#login-modal.open{display:flex;align-items:center;justify-content:center;padding:24px}
#login-modal .lm-back{position:absolute;inset:0;background:rgba(20,20,20,.5);backdrop-filter:blur(2px)}
#login-modal .lm-card{position:relative;z-index:2;width:min(430px,100%);background:var(--panel);border:1px solid var(--line-2);border-radius:16px;box-shadow:var(--shadow-lg);padding:28px 30px 26px}
#login-modal h3{margin:0 0 4px;font-size:21px}
#login-modal .lm-sub{margin:0 0 20px;font-size:13.5px;color:var(--ink-2)}
#login-modal .lm-x{position:absolute;top:12px;right:14px;width:30px;height:30px;border-radius:8px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink-2);cursor:pointer;font-size:14px;display:grid;place-items:center}
#login-modal .lm-x:hover{background:var(--fill)}
#login-modal .lm-why{display:flex;align-items:flex-start;gap:9px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--ink-2);margin-bottom:18px}
#login-modal .lm-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;font-size:12.5px}
#login-modal .lm-foot a{color:var(--ink-2);text-decoration:underline;cursor:pointer}
/* full metadata modal */
#meta-modal{position:fixed;inset:0;z-index:96;display:none}
#meta-modal.open{display:flex;align-items:flex-start;justify-content:center;padding:32px 24px}
#meta-modal .mm-back{position:absolute;inset:0;background:rgba(20,20,20,.5);backdrop-filter:blur(2px)}
#meta-modal .mm-card{position:relative;z-index:2;width:min(880px,100%);max-height:calc(100vh - 64px);overflow:auto;background:var(--panel);border:1px solid var(--line-2);border-radius:16px;box-shadow:var(--shadow-lg);padding:26px 32px 30px}
#meta-modal .mm-x{position:absolute;top:14px;right:16px;width:32px;height:32px;border-radius:8px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink-2);cursor:pointer;font-size:15px;display:grid;place-items:center;z-index:3}
#meta-modal .mm-x:hover{background:var(--fill)}
#meta-modal h2{margin:0 0 10px;font-size:24px;padding-bottom:12px;border-bottom:1px solid var(--line-2)}
.md-sec{color:#3a7bd0;font-size:15px;font-weight:600;margin:22px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line-2)}
.md-row{display:grid;grid-template-columns:190px 1fr;gap:18px;padding:5px 0;font-size:13.5px;align-items:start}
.md-row .lab{text-align:right;font-weight:700;color:var(--ink)}
.md-row .val{color:var(--ink-2);min-width:0;word-break:break-word}
.md-row .val a{color:#3a7bd0;text-decoration:none;cursor:pointer}
.md-row .val a:hover{text-decoration:underline}
.md-row .val ul{margin:0;padding-left:18px}
@media(max-width:640px){.md-row{grid-template-columns:1fr;gap:2px}.md-row .lab{text-align:left}}

/* map mock — a placeholder that actually reads as a map */
.mapmock{position:relative;overflow:hidden;background:#f5f5f4;border:1px solid var(--line);border-radius:0;min-height:300px;cursor:pointer}
.mapmock svg{display:block;width:100%;height:100%;position:absolute;inset:0}
.mm-chip{position:absolute;background:rgba(255,255,255,.94);border:1px solid var(--line-2);border-radius:6px;font-size:10.5px;color:var(--ink-2);padding:6px 9px;z-index:2;line-height:1.5}
.mm-legend{top:10px;left:10px;min-width:132px}
.mm-legend b{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.mm-legend span{display:flex;align-items:center;gap:7px;padding:1px 0}
.mm-legend i{width:11px;height:8px;border-radius:2px;border:1px solid var(--line-2);display:inline-block}
.mm-north{top:10px;right:10px;width:28px;height:30px;display:grid;place-items:center;font-size:9px;font-weight:700;padding:0;line-height:1.1}
.mm-zoom{right:10px;bottom:44px;padding:0;display:flex;flex-direction:column;overflow:hidden}

/* auto-sliding carousel — SRS §2.1.2 & §2.2.1.2.1 (5 s default, manual dots) */
const CAROUSELS={};
function carousel(id,slides,opts){
  opts=opts||{};
  CAROUSELS[id]={i:0,n:slides.length,timer:null,ms:opts.ms||5000};
  return `<div class="carousel" id="${id}">
    <span class="car-auto">Auto-slide · ${(opts.ms||5000)/1000}s</span>
    <button class="car-nav prev" onclick="carGo('${id}',-1)" aria-label="Previous">‹</button>
    <button class="car-nav next" onclick="carGo('${id}',1)" aria-label="Next">›</button>
    <div class="car-track" id="${id}-track">
      ${slides.map(s=>`<div class="car-slide">
        <div class="ph-img car-stage" onclick="${s[2]||`toast('Open full map view in the GeoNode viewer (placeholder)')`}">${s[3]||'Map / chart thumbnail — placeholder'}</div>
        <div class="car-cap"><b>${s[0]}</b><span>${s[1]}</span></div>
      </div>`).join("")}
    </div>
    <div class="car-dots">${slides.map((s,i)=>`<button class="car-dot ${i?'':'on'}" onclick="carSet('${id}',${i})" aria-label="Slide ${i+1}"></button>`).join("")}</div>
  </div>`;
}
function carRender(id){
  const c=CAROUSELS[id];if(!c)return;
  const tr=document.getElementById(id+'-track');if(!tr)return;
  tr.style.transform='translateX(-'+(c.i*100)+'%)';
  const dots=document.querySelectorAll('#'+id+' .car-dot');
  dots.forEach((d,i)=>d.classList.toggle('on',i===c.i));
}
function carGo(id,d){const c=CAROUSELS[id];if(!c)return;c.i=(c.i+d+c.n)%c.n;carRender(id);carArm(id);}
function carSet(id,i){const c=CAROUSELS[id];if(!c)return;c.i=i;carRender(id);carArm(id);}
function carArm(id){const c=CAROUSELS[id];if(!c)return;clearInterval(c.timer);c.timer=setInterval(()=>{c.i=(c.i+1)%c.n;carRender(id);},c.ms);}
function carBootAll(){Object.keys(CAROUSELS).forEach(id=>{if(document.getElementById(id)){carRender(id);carArm(id);}else{clearInterval(CAROUSELS[id].timer);delete CAROUSELS[id];}});}

const GN_AUTHORS=[["FES \u2014 GIS Team","12 Aug 2025","3,140","4"],["Partner CSO","4 Jun 2025","1,956","0"],["Academic partner","18 Mar 2025","603","5"],["Commons Platform","9 Jan 2025","2,204","2"],["FES \u2014 Land Vertical","22 Nov 2024","870","1"],["FES \u2014 Water Vertical","6 Sep 2024","1,412","3"]];
function themeResources(t){
  const out=[];

    desc:`${m[1]} \u2014 placeholder description of what the map shows, the datasets behind it and how it should be read.`,a:GN_AUTHORS[(i+2)%GN_AUTHORS.length]}));
  out.push({t:`${t.name} \u2014 status and trends, 2019\u20132024`,kind:"Document",act:"Open document",

      <div class="mod-ic">${m.ic}</div>

/* dataset row / card */
function dsIcon(k){return k==='Tabular'?'📋':'🗺';}
function datasetRow(d){
  return `<div class="ds-row" onclick="go('#/dataset/${d.id}')">
    <div class="ds-ic">${dsIcon(d.kind)}</div>
    <div style="min-width:0">
      <p class="ds-t">${d.t}</p>
      <div class="ds-m">${d.theme} · ${d.kind} · ${d.fmt} · ${d.geo} · ${d.yr} · ${d.org}</div>
    </div>
    <div class="row" style="gap:8px;align-items:center;flex-wrap:nowrap">${accessChip(d.access)}<span class="btn sm">View →</span></div>
  </div>`;
}
function datasetCard(d){
  return `<div class="rcard" onclick="go('#/dataset/${d.id}')" style="cursor:pointer">
    <div class="rc-top"><span class="rc-type-chip">${d.kind} · ${d.fmt}</span>${accessChip(d.access)}</div>
    <div class="ph-img" style="min-height:96px">${d.kind==='Tabular'?'Table preview — placeholder':'Layer thumbnail — GeoNode'}</div>
    <h4>${d.t}</h4>
    <p class="purpose">${d.geo} · ${d.yr} · ${d.feat}</p>
    <div class="meta-tags"><span class="tag">${d.theme}</span><span class="tag">${d.org}</span><span class="tag solid">${d.dl} downloads</span></div>
    <div class="rc-actions"><span class="btn sm">Open →</span><span class="btn sm" onclick="event.stopPropagation();bookmarkIt('${d.t.replace(/'/g,'')}')">🔖</span><span class="btn sm" onclick="event.stopPropagation();downloadDs('${d.id}')">⬇</span></div>
  </div>`;
}
function downloadDs(id){
  const d=dsById(id);
  if(d.access!=='Public' && !isAuthed()){toast('Restricted layer — sign in with permission to download (SRS §2.2.2.1)');return;}
  toast(isAuthed()?'Download started (placeholder)':'Public download with disclaimer (placeholder)');
}
function galleryCard(g){
  return `<div class="gcard" onclick="go('#/gallery-item/${g.id}')">
    <div class="ph-img gth">${g.kind} preview — ${g.src}</div>
    <div class="gbody">
      <div class="row" style="gap:6px"><span class="tag solid">${g.ic} ${g.kind}</span><span class="tag">${g.src}</span></div>
      <h4>${g.t}</h4>
      <div class="gm"><span class="pw-av" style="width:22px;height:22px;font-size:9px">${g.who.split(' ').map(w=>w[0]).join('').slice(0,2)}</span><span>${g.who} · ${g.org}</span><span style="margin-left:auto">${g.views} views</span></div>
    </div>
  </div>`;
}
function whatsNewCard(n){
  return `<div class="gcard" onclick="go('${n.href}')">
    <div class="ph-img gth">${n.prev}</div>
    <div class="gbody">
      <div class="row" style="gap:6px"><span class="tag solid">${n.ic} ${n.kind}</span></div>
      <h4>${n.t}</h4>
      <p style="margin:0;font-size:12.5px;color:var(--ink-2)">${n.note}</p>
      <div class="gm"><span>${n.who}</span><span style="margin-left:auto">${n.when}</span></div>
    </div>
  </div>`;
}
/* map canvas used by Map Studio / Atlas / Village Explorer */
function mapCanvas(label,note){
  return `<div class="ph-img mw-canvas" onclick="toast('${note||'Map interaction (placeholder)'}')">
    <span class="wf-note" style="text-transform:none;letter-spacing:0;font-size:12.5px">${label}</span>
    <div class="mw-float zoom"><button onclick="event.stopPropagation();toast('Zoom in')">+</button><button onclick="event.stopPropagation();toast('Zoom out')">−</button><button onclick="event.stopPropagation();toast('Reset extent')">⌂</button></div>
    <div class="mw-float scalebar">0 ──── 5 km</div>
    <div class="mw-float coords">25.44° N, 74.64° E · EPSG:4326</div>
  </div>`;
}
function layerList(items,onCount){
  return items.map((l,i)=>`<div class="layer ${i<(onCount===undefined?2:onCount)?'on':''}" onclick="this.classList.toggle('on');toast('Layer toggled: ${l.replace(/'/g,'')}')"><span class="sw"></span>${l}<span class="tog"></span></div>`).join("");
}
function kpiGrid(rows,cols){
  return `<div class="grid g${cols||3}">${rows.map(k=>`<div class="kpi"><div class="k">${k[0]}</div><b>${k[1]}</b><div class="d">${k[2]}</div></div>`).join("")}</div>`;
}
function barChart(title,sub,labels,heights){
  return `<div class="chart-ph"><div class="ct">${title}<span>${sub}</span></div>
    <div class="bars">${heights.map((h,i)=>`<i style="height:${h}%" class="${i===heights.length-1?'dark':''}"></i>`).join("")}</div>
    <div class="axis">${labels.map(l=>`<span>${l}</span>`).join("")}</div></div>`;
}

/* Section 2 \u2014 GeoNode-style faceted repository for a lens */
function themeRepo(t){
  const res=themeResources(t);
  const counts={};res.forEach(r=>counts[r.kind]=(counts[r.kind]||0)+1);
  const opt=(label,n)=>`<div class="facet-opt" onclick="toast('Filter: ${label.replace(/'/g,'')} (placeholder)')">${label}${n!==undefined?`<span class="n">${n}</span>`:''}</div>`;
  return `<div class="gn">
    <aside class="gn-side">
      <div class="gn-fh"><b>Filters</b><a onclick="toast('Filters cleared (placeholder)')">Clear</a></div>
      ${facet('Text',`<input class="wf-in" style="font-size:12.5px;padding:8px 10px" placeholder="Search within ${t.name}\u2026" onkeydown="if(event.key==='Enter')toast('Search within lens (placeholder)')">`)}
      ${facet('Keywords',['commons',t.name.toLowerCase(),'village','district','india'].map(k=>opt(k)).join(''),true)}
      ${facet('Type',['Vector Layer','Map','Document'].map(k=>opt(k+'s',counts[k]||0)).join(''))}
      ${facet('Categories',['Environment','Inland waters','Boundaries','Society'].map(k=>opt(k)).join(''),true)}
      ${facet('Responsibles',['FES \u2014 GIS Team','Partner CSO','Academic partner','Commons Platform'].map(k=>opt(k)).join(''),true)}
      ${facet('Groups',['Water vertical','Land vertical','Research'].map(k=>opt(k)).join(''),true)}
      ${facet('Group categories',['Programme','Geography','Partner'].map(k=>opt(k)).join(''),true)}
      ${facet('Date',['Last 30 days','2025','2024','2023 and older'].map(k=>opt(k)).join(''),true)}
      ${facet('Regions',['PAN-India'].concat(STATES.slice(0,4)).map(k=>opt(k)).join(''),true)}
      ${facet('Extent',`<div class="ph-img" style="min-height:96px;font-size:11px" onclick="toast('Draw a bounding box (placeholder)')">Draw extent on map \u2014 placeholder</div>`,true)}
    </aside>
    <div>
      <div class="gn-head">
        <h3>${res.length} found</h3>
        <div class="gn-tools">
          <span class="viewtog">
            <button class="${repoView==='grid'?'on':''}" title="Card view" aria-pressed="${repoView==='grid'}" onclick="setRepoView('grid')">\u25a6</button>
            <button class="${repoView==='list'?'on':''}" title="List view" aria-pressed="${repoView==='list'}" onclick="setRepoView('list')">\u2630</button>
          </span>
          <select class="wf-in" style="max-width:168px;font-size:12.5px;padding:8px 12px"><option>Most recent</option><option>Most popular</option><option>Title A\u2013Z</option></select>
        </div>
      </div>
      ${repoView==='grid'
        ? `<div class="gn-grid">${res.map((r,i)=>gnCard(r,t.id,i)).join("")}</div>`
        : res.map((r,i)=>gnRow(r,t.id,i)).join("")}
      <div class="row mt16" style="justify-content:space-between;align-items:center">
        <span class="wf-note">Showing 1\u2013${res.length} of ${res.length}</span>
        <div class="row" style="gap:6px"><span class="btn sm">\u2039</span><span class="btn sm primary">1</span><span class="btn sm">2</span><span class="btn sm">\u203a</span></div>
      </div>
    </div>
  </div>`;
}

screens.dataset=(p)=>{

/* ---- global search overlay — SRS §2.2.2.1 / §2.3 ---- */
/* ---- ROUTER ---- */
function parseHash(){
  const raw=(location.hash||"#/home").replace(/^#\//,"");
  const [pathPart,queryPart]=raw.split("?");
  const parts=pathPart.split("/").filter(Boolean);
  const params={};
  if(queryPart){queryPart.split("&").forEach(kv=>{const[k,v]=kv.split("=");params[k]=v;});}
  return {parts,params};
}
function render(){
  const {parts,params}=parseHash();
  const name=parts[0]||"home";
  let html;
  if(name==="theme"||name==="mapview"||name==="dataset"||name==="gallery-item"||name==="blog"||name==="lcapmap"||name==="vemap"){params.id=parts[1];html=screens[name](params);}
  else if(name==="resource"){params.id=parts[1];params.i=parts[2];html=screens.resource(params);}
  else if(screens[name]){html=screens[name](params);}
  else{html=screens.home();}
  document.getElementById("app").innerHTML=html;
  window.scrollTo(0,0);
  carBootAll();
}
function go(hash){if(location.hash===hash){render();}else{location.hash=hash;}}
window.addEventListener("hashchange",render);

let toastTimer;
function toast(msg){let t=document.getElementById("wf-toast");
  if(!t){t=document.createElement("div");t.id="wf-toast";t.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b2b2b;color:#fff;padding:10px 16px;border-radius:6px;font-size:13px;z-index:80;max-width:80vw;transition:opacity .2s";document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity="1";clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.style.opacity="0";},1800);}

  try{ render(); }

    var a=document.getElementById("app");
    if(a) a.innerHTML='<div style="max-width:600px;margin:60px auto;padding:0 24px;font-family:system-ui,-apple-system,sans-serif;color:#171717"><h2>Couldn’t load the wireframe</h2><p style="color:#555">Please hard-refresh the page (Cmd+Shift+R / Ctrl+Shift+R).</p><pre style="white-space:pre-wrap;color:#999;font-size:12px">'+(err&&err.message?err.message:err)+'</pre></div>';
  }
}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",boot);}else{boot();}
