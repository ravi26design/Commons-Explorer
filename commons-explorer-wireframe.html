<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Commons Explorer — UI Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400;1,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* ============================================================
   COMMONS EXPLORER — UI DESIGN
   Design system: the Commons Platform redesign language
   warm brown ink · sage green primary · gold CTAs · cream neutrals
   square panels · flat depth · Lato + DM Serif Display
   ============================================================ */
:root{
  --ink:#4a423e; --ink-2:#5a514c; --ink-3:#6f6f6f; --ink-4:#9a938d; --ink-deep:#3b3531;
  --muted:#6f6f6f; --muted-2:#7b746e; --faint:#9a938d;
  /* primary: sage green · secondary: gold */
  --green:#4e7c59; --green-h:#40684a; --green-d:#3f6549; --green-soft:#edf3ee; --green-line:#cfe0d4;
  --blue:#4e7c59; --blue-h:#40684a; --blue-soft:#edf3ee;
  --cta:#d4a24c; --cta-h:#4e7c59; --cta-ink:#fff; --card:#f3e8dc;
  --amber:#d4a24c; --amber-soft:#fbf4e7; --amber-line:#ecd9b4; --amber-d:#8a6520;
  --red:#c46a4a; --red-soft:#fbeee9;
  --line:#ece7e0; --line-2:#ddd6cc; --bg:#fff; --bg-soft:#faf8f3; --chip:#f2e9dc; --white:#fff;
  --panel:#fff; --panel-2:#faf8f3; --fill:#f6f1e8; --fill-2:#ece7e0; --active:#4e7c59;
  /* the five commons families */
  --t-forest:#3f6549;   --t-forest-s:#edf3ee;
  --t-pasture:#d4a24c;  --t-pasture-s:#fbf4e7;
  --t-water:#3d7b8c;    --t-water-s:#eaf2f4;
  --t-coastal:#4a8f86;  --t-coastal-s:#eaf4f2;
  --t-cultural:#c46a4a; --t-cultural-s:#fbeee9;
  /* type: Lato for text, DM Serif Display for headings */
  --sans:'Lato','Helvetica Neue',Helvetica,'Segoe UI',Roboto,system-ui,Arial,sans-serif;
  --serif:'DM Serif Display',Georgia,'Times New Roman',serif;
  --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  --shadow-card:none;
  --shadow-lift:0 18px 34px -22px rgba(74,66,62,.4);
  --shadow-float:0 16px 36px -12px rgba(74,66,62,.24);
  --shadow-sm:var(--shadow-card); --shadow-md:var(--shadow-lift); --shadow-lg:0 30px 70px -20px rgba(20,30,80,.5);
  --sh-cta:0 8px 18px -8px rgba(212,162,76,.55); --sh-cta-h:0 12px 26px -8px rgba(212,162,76,.6);
  --sh-green-h:0 12px 26px -8px rgba(78,124,89,.6);
  --radius:0; --radius-sm:.6rem; --r:.9rem; --r-sm:.6rem; --r-lg:1.1rem; --maxw:90rem; --gap:1.35rem;
  --grad-green:linear-gradient(140deg,#33513b 0%,#3f6549 58%,#46704f 100%);
  --grad-ink:linear-gradient(135deg,#3b3531 0%,#4a423e 60%,#554b46 100%);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);background:var(--white);font-size:15.5px;line-height:1.55;letter-spacing:.1px;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
img{max-width:100%}
[onclick]{cursor:pointer}
h1,h2,h3,h4{font-family:var(--serif);font-weight:400;color:var(--ink);letter-spacing:-.005em}
h1{font-size:clamp(2.1rem,4.4vw,2.75rem);letter-spacing:-.01em;line-height:1.14;margin:0}
h2{margin:0}h3,h4{margin:0}
h5,h6{font-weight:700;color:var(--ink);margin:0}
p{margin:0}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
::selection{background:var(--green);color:#fff}
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:6px}
*::-webkit-scrollbar-thumb:hover{background:var(--faint)}
*::-webkit-scrollbar-track{background:transparent}
.ph-img[onclick]:hover,.video-ph[onclick]:hover{filter:brightness(.975)}

/* ---------- primitives ---------- */
.wf-note{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.ph-img{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;text-align:center;
  padding:1rem;min-height:120px;color:var(--muted-2);font-size:.8rem;font-weight:600;border:1px solid var(--line-2);border-radius:0;
  background:linear-gradient(135deg,rgba(78,124,89,.06),rgba(212,162,76,.06)),
   repeating-linear-gradient(45deg,transparent,transparent 11px,rgba(74,66,62,.045) 11px,rgba(74,66,62,.045) 12px),#fff}
.ph-line{height:10px;background:var(--fill-2);border-radius:3px;margin:7px 0}
.ph-line.w90{width:90%}.ph-line.w80{width:80%}.ph-line.w60{width:60%}.ph-line.w40{width:40%}.ph-line.w30{width:30%}
.icon-box{width:2.4rem;height:2.4rem;border:0;border-radius:.7rem;background:var(--green-soft);color:var(--green-d);display:inline-flex;align-items:center;justify-content:center;font-size:1rem;flex:0 0 auto}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:1px solid var(--line-2);background:#fff;color:var(--green-d);
  padding:.62rem 1.25rem;border-radius:.6rem;font-size:.9rem;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;
  transition:transform .12s,box-shadow .2s,background .2s,border-color .15s,color .15s}
.btn:hover{background:var(--green);color:#fff;border-color:var(--green)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--cta);color:var(--cta-ink);border-color:transparent;box-shadow:var(--sh-cta)}
.btn.primary:hover{background:var(--green);color:#fff;transform:translateY(-1px);box-shadow:var(--sh-green-h)}
.btn.sm{padding:.42rem .85rem;font-size:.8rem;border-radius:.5rem}
.btn.link{border:none;background:none;padding:.2rem 0;text-decoration:none;color:var(--cta);font-weight:700;box-shadow:none}
.btn.link:hover{color:var(--green-d);background:none}
.btn.block{width:100%;justify-content:center}
.btn.btn-icon{padding:0;width:2.4rem;height:2.4rem;border-radius:.65rem;color:var(--muted);display:inline-grid;place-items:center}
.btn.btn-icon:hover{border-color:var(--green);color:var(--green);background:var(--green-soft)}
.btn:focus-visible,.wf-in:focus-visible,select:focus-visible,input:focus-visible,.navlink:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* ---------- layout ---------- */
.container{max-width:var(--maxw);margin:0 auto;padding:0 2rem}
@media(max-width:1024px){.container{padding:0 1.5rem}}
@media(max-width:600px){.container{padding:0 1.15rem}}
header.site{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;box-shadow:0 1px 14px -8px rgba(74,66,62,.35)}
.nav{display:flex;align-items:center;gap:1.5rem;height:5rem}
.logo{border:none;padding:0;cursor:pointer;flex:0 0 auto;display:inline-flex;align-items:center;gap:10px;line-height:1.05}
.logo .mk{width:38px;height:38px;border-radius:11px;background:var(--green);display:grid;place-items:center;color:#fff;flex:none;
  box-shadow:0 8px 16px -8px rgba(57,162,72,.6)}
.logo .mk svg{width:21px;height:21px;display:block}
.logo .bt{font-size:1.05rem;font-weight:800;letter-spacing:-.02em;color:var(--ink);text-transform:none}
.logo small{display:block;font-weight:700;font-size:.62rem;color:var(--muted-2);letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
.nav ul{list-style:none;display:flex;gap:1.75rem;margin:0;padding:0;flex:1 1 auto;flex-wrap:wrap;justify-content:flex-end}
.nav a.navlink{text-decoration:none;color:var(--muted);font-size:.95rem;font-weight:500;padding:.35rem 0;cursor:pointer;display:inline-block;
  white-space:nowrap;transition:color .15s;border-radius:0}
.nav a.navlink:hover{color:var(--ink);background:none}
.nav a.navlink.active{color:var(--green-d);background:none;font-weight:700}
@media(max-width:1320px){.nav ul{gap:1.1rem}.nav a.navlink{font-size:.86rem}}

.crumbs{padding:1.1rem 0 0;font-size:.83rem;color:var(--muted-2);display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
.crumbs a{color:var(--muted-2);text-decoration:none;cursor:pointer;font-weight:600;transition:color .12s}
.crumbs a:hover{color:var(--green-d);text-decoration:none}
.crumbs span.sep{color:var(--line-2)}
.crumbs span.here{color:var(--ink);font-weight:700}
main{min-height:60vh;padding-bottom:3rem;animation:fade .3s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}

.section{padding:2.75rem 0}
.section h2{font-size:1.6rem;line-height:1.25;margin:0 0 .4rem}
.section .sub{color:var(--muted);font-size:.98rem;line-height:1.65;max-width:52rem;margin:0 0 1.35rem}
.eyebrow{display:inline-flex;align-items:center;gap:.55rem;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--green-d);background:var(--green-soft);border:1px solid var(--green-line);padding:.38rem .85rem;border-radius:999px;margin-bottom:.8rem}
.eyebrow::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(57,162,72,.16);flex:none}
.panel{background:#fff;border:1px solid var(--line);border-radius:0;padding:1.5rem;box-shadow:var(--shadow-card)}

.grid{display:grid;gap:var(--gap)}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.row{display:flex;gap:.75rem;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap}

.card{background:#fff;border:1px solid var(--line);border-radius:0;padding:1.35rem;display:flex;flex-direction:column;gap:.7rem;
  box-shadow:var(--shadow-card);transition:box-shadow .2s,border-color .15s,transform .15s}
.card h3{margin:0;font-size:1.05rem;line-height:1.35}
.card p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.6}
.card .cta{margin-top:auto;padding-top:.35rem}
.card.click{cursor:pointer}
.card.click:hover{transform:translateY(-2px);border-color:var(--line-2);box-shadow:var(--shadow-lift)}
.card.click:hover h3{color:var(--green-d)}

.hero{background:linear-gradient(to bottom,var(--bg-soft),#fff);border:1px solid var(--line);border-radius:0;padding:2.75rem 2.5rem;margin-top:1.25rem;box-shadow:var(--shadow-card)}
.hero h1{font-size:clamp(1.9rem,3.2vw,2.4rem);margin:0 0 .8rem;line-height:1.16}
.hero p.lead{font-size:1.05rem;color:var(--muted);line-height:1.7;max-width:40rem;margin:0 0 1.25rem}
.lead{font-size:1.05rem;color:var(--muted);line-height:1.7}

/* pathway */
.pathway{display:flex;flex-wrap:wrap;gap:.6rem;align-items:stretch}
.pw-step{flex:1 1 150px;min-width:130px;border:1px solid var(--line);border-radius:.8rem;background:#fff;padding:.85rem .95rem;cursor:pointer;
  box-shadow:0 1px 2px rgba(74,66,62,.04);transition:.15s}
.pw-step:hover{border-color:var(--green);transform:translateY(-2px)}
.pw-step .num{font-family:var(--mono);font-size:.66rem;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
.pw-step .nm{font-size:.87rem;font-weight:700;margin-top:2px;color:var(--ink)}
.pw-step.active{background:var(--ink);border-color:var(--ink)}
.pw-step.active .nm{color:#fff}.pw-step.active .num{color:rgba(255,255,255,.62)}
.pw-arrow{align-self:center;color:var(--line-2);font-size:1rem}
.pw-flash{outline:2px solid var(--green);outline-offset:5px;border-radius:0;transition:outline-color .3s}
.chap-num{font-family:var(--mono);font-size:2.6rem;font-weight:800;color:var(--line-2);line-height:1;margin-bottom:.35rem}
.pullquote{border-left:4px solid var(--green);background:var(--green-soft);border-radius:0 var(--r) var(--r) 0;padding:1.25rem 1.5rem;margin:.25rem 0;
  font-size:1.08rem;line-height:1.7;color:var(--ink-2);font-weight:500}
.story-stat{display:flex;align-items:center;gap:.9rem;border:1px solid var(--line);border-radius:0;background:#fff;padding:1.05rem 1.25rem;box-shadow:var(--shadow-card)}
.story-stat b{font-size:1.9rem;font-weight:800;line-height:1;letter-spacing:-.02em;color:var(--green-d)}
.role-badge{display:inline-flex;align-items:center;gap:.4rem;font-size:.82rem;font-weight:700;color:var(--green-d);background:var(--green-soft);
  border:1px solid var(--green-line);border-radius:999px;padding:.35rem .85rem;white-space:nowrap}

/* profile chip */
.profilew{position:relative}
.profilew-btn{display:inline-flex;align-items:center;gap:.55rem;border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:.25rem .8rem .25rem .3rem;
  cursor:pointer;font:inherit;font-size:.85rem;color:var(--ink);transition:box-shadow .15s,border-color .15s}
.profilew-btn:hover,.profilew.open .profilew-btn{border-color:var(--green-line);box-shadow:0 0 0 3px rgba(46,133,64,.18)}
.pw-av{width:1.85rem;height:1.85rem;border-radius:999px;background:var(--grad-ink);color:#fff;display:inline-grid;place-items:center;font-size:.68rem;font-weight:800;flex:none}
.pw-av.lg{width:2.9rem;height:2.9rem;font-size:.95rem}
.pw-name{font-weight:700}.pw-cv{color:var(--faint);font-size:.7rem;transition:transform .15s}
.profilew.open .pw-cv{transform:rotate(180deg)}
.profilew-menu{position:absolute;right:0;top:calc(100% + .55rem);width:16rem;background:#fff;border:1px solid var(--line);border-radius:.8rem;
  box-shadow:var(--shadow-float);padding:.4rem;display:none;z-index:60}
.profilew.open .profilew-menu{display:block}
/* apps launcher */
.appsw{position:relative;display:inline-flex}
.appsw-menu{position:absolute;right:0;top:calc(100% + .6rem);width:32rem;max-width:92vw;background:#fff;border:1px solid var(--line);border-radius:0;
  box-shadow:var(--shadow-float);padding:1.35rem 1.5rem;display:none;z-index:60}
.appsw.open .appsw-menu{display:block}
.appsw-cols{display:grid;grid-template-columns:1.9fr 1fr;gap:1.25rem}
.appsw-cols>div+div{padding-left:1.25rem;border-left:1px solid var(--line)}
.appsw-h{font-size:.68rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-bottom:.9rem}
.app-grid2{display:grid;grid-template-columns:repeat(3,1fr);gap:.25rem}
.app-grid1{display:grid;grid-template-columns:1fr;gap:.25rem}
.app-tile{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:.45rem;padding:.75rem .3rem;border-radius:0;cursor:pointer;
  text-align:center;border:1px solid transparent;transition:.15s}
.app-tile:hover{background:var(--bg-soft);border-color:var(--line)}
.app-grid1 .app-tile{flex-direction:row;gap:.7rem;text-align:left;padding:.6rem .65rem;align-items:center}
.app-ic{width:2.35rem;height:2.35rem;border-radius:.65rem;background:var(--green-soft);color:var(--green-d);border:0;display:grid;place-items:center;font-size:1.1rem;flex:none}
.app-nm{font-size:.78rem;font-weight:600;color:var(--ink);line-height:1.3}
@media(max-width:560px){.appsw-cols{grid-template-columns:1fr}.appsw-cols>div+div{padding-left:0;border-left:0}}
/* account pages: left-side nav */
.acct-nav{display:flex;flex-direction:column;gap:0;position:sticky;top:5.75rem}
.acct-nav .acct-h{font-size:.68rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:0 .8rem .5rem}
.acct-item{display:flex;align-items:center;gap:.7rem;padding:.7rem .8rem;margin-bottom:.15rem;border-radius:.55rem;font-size:.92rem;font-weight:600;
  color:var(--muted);cursor:pointer;border:1px solid transparent;transition:.15s}
.acct-item:hover{background:var(--bg-soft);color:var(--ink)}
.acct-item.active{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 8px 18px -10px rgba(78,124,89,.6)}
.acct-item .acct-ic{font-size:.95rem;flex:none}
@media(max-width:760px){.acct-nav{position:static;flex-direction:row;flex-wrap:wrap;gap:.4rem}.acct-item{border-color:var(--line-2);background:#fff;margin-bottom:0}.acct-grid{grid-template-columns:1fr!important}}
.pw-head{display:flex;align-items:center;gap:.7rem;padding:.7rem}
.pw-head b{display:block;font-size:.92rem;color:var(--ink)}.pw-head span{font-size:.75rem;color:var(--muted-2)}
.pw-div{height:1px;background:var(--line);margin:.35rem 0}
.pw-item{display:flex;align-items:center;gap:.65rem;width:100%;background:none;border:0;padding:.6rem .7rem;border-radius:.55rem;font:inherit;font-size:.9rem;
  font-weight:600;color:var(--ink);cursor:pointer;text-align:left}
.pw-item:hover{background:var(--bg-soft)}
.pw-ic{width:1.1rem;text-align:center;color:var(--faint)}
.pw-item.danger{color:var(--red)}
.role-opt{display:flex;justify-content:space-between;align-items:center;gap:.75rem;border:1px solid var(--line);border-radius:.6rem;padding:.7rem .85rem;cursor:pointer;background:#fff;transition:.15s}
.role-opt:hover{border-color:var(--green);background:var(--green-soft)}
.role-opt .ro-tx b{display:block;font-size:.88rem;color:var(--ink)}
.role-opt .ro-tx span{font-size:.76rem;color:var(--muted-2)}
.role-opt .ra{font-size:.8rem;color:var(--green-d);font-weight:700;white-space:nowrap}

/* resource card */
.rcard{background:#fff;border:1px solid var(--line);border-radius:0;padding:1.1rem;display:flex;flex-direction:column;gap:.6rem;box-shadow:var(--shadow-card);
  transition:box-shadow .2s,transform .15s,border-color .15s}
.rcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);border-color:var(--line-2)}
.rcard .rc-top{display:flex;justify-content:space-between;gap:.5rem;align-items:flex-start}
.rcard h4{margin:0;font-size:1.02rem;line-height:1.35}
.rcard .purpose{color:var(--muted);font-size:.85rem;margin:0}
.meta-tags{display:flex;flex-wrap:wrap;gap:.4rem}
.tag{display:inline-flex;align-items:center;gap:.35rem;font-size:.76rem;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;
  background:var(--chip);color:var(--muted);white-space:nowrap}
.tag.solid{background:var(--green-soft);color:var(--green-d);border-color:var(--green-line)}
.rc-actions{display:flex;gap:.5rem;margin-top:.15rem;flex-wrap:wrap}
.rc-type-chip{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);border:1px solid var(--line-2);border-radius:999px;padding:.2rem .6rem}

/* filter sidebar */
.layout-side{display:grid;grid-template-columns:250px 1fr;gap:1.5rem;align-items:start}
.filters{background:#fff;border:1px solid var(--line);border-radius:0;padding:1.15rem;position:sticky;top:5.75rem;box-shadow:var(--shadow-card)}
.fgroup{border-bottom:1px solid var(--line);padding:.85rem 0}
.fgroup:first-child{padding-top:0}
.fgroup h4{margin:0 0 .55rem;font-family:var(--sans);font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--faint)}
.fopt{display:flex;align-items:center;gap:.5rem;font-size:.87rem;color:var(--ink-2);padding:.2rem 0;cursor:pointer}
.fopt input{accent-color:var(--green)}
.filter-actions{display:flex;gap:.5rem;margin-top:.9rem}

/* search bar */
.searchfield{display:flex;align-items:center;gap:.65rem;border:1px solid var(--line-2);background:#fff;border-radius:.85rem;padding:.8rem 1rem;
  box-shadow:0 12px 38px -18px rgba(74,66,62,.24);transition:border-color .15s,box-shadow .15s}
.searchfield:focus-within{border-color:var(--green);box-shadow:0 0 0 3px rgba(78,124,89,.12),0 12px 38px -18px rgba(74,66,62,.24)}
.searchfield input{border:none;outline:none;flex:1;font:inherit;font-size:.95rem;background:transparent;color:var(--ink)}
.searchfield input::placeholder{color:var(--faint)}
.searchfield .icon-box{width:1.8rem;height:1.8rem;font-size:.85rem;background:none;color:var(--faint)}

/* flow diagram */
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:.6rem}
.flow .node{flex:1 1 8rem;border:1px solid var(--line);background:#fff;border-radius:.8rem;padding:.85rem 1rem;font-size:.87rem;font-weight:700;color:var(--ink);
  text-align:center;min-width:96px;box-shadow:0 1px 2px rgba(74,66,62,.04);transition:.15s}
.flow .node:hover{border-color:var(--green);transform:translateY(-2px)}
.flow .node.strong{background:var(--ink);border-color:var(--ink);color:#fff}

.split .sr .ctx-row h5{color:#fff;font-size:.92rem;text-transform:none;letter-spacing:0}

.dropdown{position:relative}

.wf-tl{display:flex;flex-direction:column}

.tabs-c{display:flex;gap:.4rem;flex-wrap:wrap;border-bottom:0;padding-bottom:0;margin:1rem 0 1.25rem}
.tab-c{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:.42rem .9rem;font-size:.82rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:.45rem;color:var(--ink);transition:.15s}

.doc-card{background:#fff;border:1px solid var(--line);border-radius:0;padding:1.1rem;display:flex;flex-direction:column;box-shadow:var(--shadow-card);transition:.15s}

.mono{font-family:var(--mono)}
.docview{min-height:520px;display:flex;flex-direction:column}

.docview-ic{width:7rem;height:7rem;border:1px solid var(--line-2);background:#fff;border-radius:1rem;display:grid;place-items:center;margin:0 auto .9rem;color:var(--faint)}

.dpage{background:#fff;border:1px solid var(--line-2);border-radius:0;box-shadow:0 18px 40px -20px rgba(74,66,62,.4);width:100%;max-width:520px;margin:0 auto;padding:2.25rem 2.5rem;text-align:left}
.dpage-h{font-family:var(--serif);font-size:1.25rem;color:var(--ink);margin-bottom:.25rem}

.dline{height:7px;background:var(--line-2);border-radius:2px;margin:8px 0}
.dline.w95{width:95%}.dline.w90{width:90%}.dline.w85{width:85%}.dline.w80{width:80%}.dline.w70{width:70%}.dline.w60{width:60%}.dline.w50{width:50%}.dline.w40{width:40%}
.dbul{display:flex;gap:9px;align-items:center;margin:8px 0}

.dtable{width:100%;max-width:640px;margin:0 auto;border:1px solid var(--line-2);border-radius:0;overflow:hidden;background:#fff}
.dtable .tr{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;border-top:1px solid var(--line)}

.dvid{width:100%;max-width:640px;aspect-ratio:16/9;margin:0 auto;background:#0e1524;border-radius:0;display:grid;place-items:center}

.dimg{width:100%;max-width:640px;margin:0 auto;border:1px solid var(--line-2);border-radius:0;overflow:hidden;background:#fff}
.dimg-h{background:var(--bg-soft);padding:.9rem 1rem;text-align:center;font-weight:800;font-size:.9rem;border-bottom:1px solid var(--line);color:var(--ink)}

.mchart{display:flex;gap:10px;align-items:flex-end;height:160px}
.mbar{flex:1;background:var(--green-line);border-radius:3px 3px 0 0}

.mpie{width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--green-d) 0 40%,var(--green-line) 40% 70%,var(--cta) 70% 100%);margin:0 auto}
.dtext{font-size:.82rem;line-height:1.7;color:var(--muted);margin:0 0 .4rem}
.dul{margin:.4rem 0;padding-left:1.15rem}

.dpage-foot{margin-top:1.4rem;padding-top:.75rem;border-top:1px solid var(--line);font-size:.66rem;color:var(--faint);text-align:center;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.dlegend{grid-column:1 / -1;display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;font-size:.74rem;color:var(--muted)}

.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
.kcol{background:var(--bg-soft);border:1px solid var(--line);border-radius:0;padding:.85rem}

.legend-list{display:flex;flex-direction:column;gap:2px}

.lscape{position:relative;min-height:360px;overflow:hidden;background:linear-gradient(160deg,#eef4fb,#f6f8fc);border-radius:0}

.lpin{position:absolute;z-index:2;display:inline-flex;align-items:center;gap:.5rem;background:#fff;border:1px solid var(--line-2);
  border-radius:.7rem;padding:.5rem .8rem;font-size:.82rem;font-weight:700;color:var(--ink);box-shadow:0 10px 22px -10px rgba(74,66,62,.45);cursor:pointer;white-space:nowrap;transition:.15s}

.sig-map{border:1px solid var(--line);border-radius:0;overflow:hidden;background:#fff;box-shadow:var(--shadow-card)}

/* ---------- footer ---------- */
footer.site{position:relative;z-index:1;background:#fff;color:var(--muted);border-top:1px solid var(--line-2);margin-top:2rem}
footer.site .cols{display:grid;grid-template-columns:minmax(0,1.1fr) repeat(3,minmax(0,1fr));gap:2.5rem;padding:3.5rem 0 2.25rem}
footer.site .logo .bt em{display:block;font-style:normal;font-size:1rem;font-weight:800;letter-spacing:-.02em;color:var(--green);text-transform:none;margin-top:0}
footer.site p{font-size:.87rem;color:var(--muted);max-width:19rem;line-height:1.7}
footer.site h5{margin:0 0 1rem;font-size:.95rem;font-weight:800;text-transform:none;letter-spacing:0;color:var(--ink)}
footer.site ul{list-style:none;margin:0;padding:0}
footer.site li{padding:.42rem 0;color:var(--muted);font-size:.92rem;cursor:pointer;transition:color .15s}
footer.site li:hover{color:var(--cta);text-decoration:none}
footer .bar{border-top:1px solid var(--line-2);padding:1.35rem 0 1.75rem;font-size:.85rem;color:var(--muted-2);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.75rem}

.overlay{position:fixed;inset:0;background:rgba(20,28,60,.55);backdrop-filter:blur(2px);z-index:60;display:none;align-items:flex-start;justify-content:center;padding-top:9vh}
.modal-back{position:fixed;inset:0;background:rgba(20,28,60,.58);backdrop-filter:blur(2px);z-index:90;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.modal-card{background:#fff;border:0;border-radius:0;box-shadow:var(--shadow-lg);width:min(31rem,100%);padding:2.5rem 2.25rem 2rem;text-align:center;position:relative}
.modal-x{position:absolute;top:.85rem;right:.85rem;width:2rem;height:2rem;border-radius:.55rem;border:1px solid var(--line-2);background:#fff;color:var(--muted);cursor:pointer;font-size:.85rem;display:grid;place-items:center}
.modal-x:hover{background:var(--bg-soft);color:var(--ink)}
.overlay.open{display:flex}
.searchpanel{background:#fff;border:1px solid var(--line-2);border-radius:0;width:min(620px,92vw);padding:1.5rem;box-shadow:var(--shadow-lg)}
.searchpanel h3{margin:0 0 .25rem;font-size:1.3rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.75rem}
.chip{display:inline-flex;align-items:center;gap:.4rem;background:#fff;border:1px solid var(--line-2);border-radius:999px;padding:.4rem .85rem;font-size:.83rem;font-weight:600;color:var(--ink);cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--green);color:var(--green);background:var(--green-soft)}

.mt8{margin-top:.5rem}.mt12{margin-top:.75rem}.mt16{margin-top:1rem}.mt24{margin-top:1.5rem}
.mb0{margin-bottom:0}.muted{color:var(--muted)}.stack{display:flex;flex-direction:column;gap:.9rem}

@media(max-width:1000px){.g4,.g5,.g3{grid-template-columns:repeat(2,1fr)}.layout-side{grid-template-columns:1fr}.filters{position:static}.kanban{grid-template-columns:1fr 1fr}footer.site .cols{grid-template-columns:1fr 1fr;gap:2rem}}
@media(max-width:640px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}.nav ul{display:none}.hero h1{font-size:1.6rem}.split{grid-template-columns:1fr}.kanban{grid-template-columns:1fr}footer.site .cols{grid-template-columns:1fr;padding:2.5rem 0 1.5rem}}
#proto-hint{position:fixed;bottom:12px;right:12px;z-index:50;background:var(--ink);color:#fff;font-size:.72rem;font-weight:600;padding:.45rem .8rem;border-radius:999px;opacity:.9;cursor:pointer}

/* ============================================================
   COMMONS EXPLORER — module components
   ============================================================ */
/* carousel (homepage + thematic map carousel) */
.carousel{position:relative;border:1px solid var(--line-2);border-radius:0;background:#fff;overflow:hidden;box-shadow:0 24px 60px -32px rgba(74,66,62,.45)}
.car-track{display:flex;transition:transform .35s ease}
.car-slide{flex:0 0 100%;position:relative}
.car-stage{min-height:480px;border:none;border-radius:0}
@media(max-width:1000px){.car-stage{min-height:380px}}
@media(max-width:640px){.car-stage{min-height:280px}}
.car-cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(to top,rgba(59,53,49,.86),rgba(59,53,49,0));color:#fff;padding:4rem 2rem 1.6rem;pointer-events:none}
.car-cap b{display:block;font-family:var(--serif);font-weight:400;font-size:1.6rem;letter-spacing:-.01em;line-height:1.2}
.car-cap span{display:block;margin-top:.3rem;font-size:.95rem;color:rgba(255,255,255,.86)}
.car-nav{position:absolute;top:50%;transform:translateY(-50%);width:2.5rem;height:2.5rem;border-radius:50%;border:1px solid var(--line-2);background:rgba(255,255,255,.95);
  cursor:pointer;font-size:1.1rem;color:var(--ink);display:grid;place-items:center;z-index:3;box-shadow:var(--shadow-float);transition:.15s}
.car-nav:hover{background:var(--green);color:#fff;border-color:var(--green)}
.car-nav.prev{left:.9rem}.car-nav.next{right:.9rem}
.car-dots{display:flex;gap:.45rem;justify-content:center;padding:.85rem 0;border-top:1px solid var(--line);background:#fff}
.car-dot{width:8px;height:8px;border-radius:50%;background:var(--line-2);border:0;padding:0;cursor:pointer;transition:width .2s,background .2s}
.car-dot.on{background:var(--green);width:22px;border-radius:5px}
.car-auto{position:absolute;top:.75rem;right:.85rem;z-index:3;font-size:.62rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;background:rgba(255,255,255,.92);
  border:1px solid var(--line);border-radius:999px;padding:.25rem .65rem;color:var(--faint)}

/* home page title */
.home-title{font-size:clamp(2.1rem,4vw,2.75rem);line-height:1.12;letter-spacing:-.01em;margin:0 0 1rem;font-weight:400}

/* module tiles (home: 4 modules) */
.mod-tile{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:0;padding:1.35rem;display:flex;flex-direction:column;gap:.6rem;cursor:pointer;
  box-shadow:var(--shadow-card);transition:transform .18s ease,box-shadow .2s ease,border-color .15s}
.mod-tile::after{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--green);transform:scaleX(0);transform-origin:left;transition:transform .28s ease}
.mod-tile:hover{transform:translateY(-3px);border-color:var(--green-line);box-shadow:var(--shadow-lift)}
.mod-tile:hover::after{transform:scaleX(1)}
.mod-tile:hover h3{color:var(--green-d)}
.mod-ic{width:3.2rem;height:3.2rem;border-radius:.9rem;border:0;background:var(--green-soft);color:var(--green-d);display:grid;place-items:center;font-size:1.4rem;transition:background .2s}
.mod-tile:hover .mod-ic{background:var(--green-line)}
.mod-tile h3{margin:0;font-size:1.15rem;line-height:1.25;transition:color .15s}
.mod-tile p{margin:0;font-size:.92rem;color:var(--muted);line-height:1.65}
.mod-tile .sub-links{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:auto;padding-top:.4rem}
.mod-grid{gap:1.35rem}
.mod-tile.lg{padding:1.9rem 2rem;gap:.75rem;min-height:190px;border-radius:0}
.mod-tile.lg h3{font-size:1.5rem;line-height:1.2;letter-spacing:-.02em}
.mod-tile.lg .mod-sub{display:block;font-family:var(--sans);font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--green-d);margin-top:.4rem}
.mod-tile.lg p{font-size:.95rem;max-width:520px}
@media(max-width:640px){.mod-tile.lg{padding:1.35rem;min-height:0}.mod-tile.lg h3{font-size:1.3rem}}

/* staged carousel (thematic lens — carousel view) */
.car-stage3{display:flex;gap:1.25rem;align-items:flex-end;justify-content:center;padding:1.6rem 1.9rem .5rem;background:var(--bg-soft)}
.car-pane{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center}
.car-shot{width:100%;border:1px solid var(--line-2);border-radius:0;background:#fff;overflow:hidden;cursor:pointer;box-shadow:var(--shadow-card);transition:transform .15s,box-shadow .15s}
.car-shot:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
.car-shot .cs-bar{display:flex;align-items:center;gap:5px;padding:.4rem .6rem;border-bottom:1px solid var(--line);background:var(--bg-soft)}
.car-shot .cs-bar i{width:7px;height:7px;border-radius:50%;background:var(--line-2);display:block}
.car-shot .cs-bar span{margin-left:6px;font-size:.66rem;font-weight:700;color:var(--faint);letter-spacing:.04em;text-transform:uppercase}
.car-shot .ph-img{border:none;border-radius:0}
.car-pane:nth-child(1) .ph-img{min-height:168px}
.car-pane:nth-child(2) .ph-img{min-height:196px}
.car-pane:nth-child(3) .ph-img{min-height:224px}
.car-pill{margin-top:-1rem;position:relative;z-index:2;background:var(--green);color:#fff;border-radius:999px;padding:.6rem 1.35rem;font-size:.86rem;font-weight:700;text-align:center;
  box-shadow:0 10px 22px -10px rgba(78,124,89,.75)}
.car-sub{font-size:.76rem;color:var(--muted-2);margin-top:.5rem;text-align:center}
.car-pane:only-child{max-width:880px;margin:0 auto}
.car-pane:only-child .ph-img{min-height:330px}
@media(max-width:820px){.car-stage3{flex-direction:column;align-items:stretch}.car-pane .ph-img,.car-pane:nth-child(1) .ph-img,.car-pane:nth-child(2) .ph-img,.car-pane:nth-child(3) .ph-img{min-height:150px}}

/* LCAP — map viewer layer panel, vertical toolbar, stage tracker */
.lyr{display:flex;align-items:center;gap:.5rem;padding:.55rem .6rem;border:1px solid var(--line-2);border-radius:.5rem;margin-bottom:.35rem;background:#fff;font-size:.82rem;color:var(--muted);cursor:pointer;transition:.15s}
.lyr:hover{border-color:var(--green);background:var(--green-soft)}
.lyr.on{background:var(--green-soft);border-color:var(--green-line);color:var(--ink);font-weight:600}
.lyr .gr{color:var(--faint);font-size:.7rem;letter-spacing:-1px}
.lyr .cb{width:.85rem;height:.85rem;border:1px solid var(--line-2);border-radius:.2rem;display:grid;place-items:center;font-size:.6rem;color:#fff;flex:none;background:#fff}
.lyr.on .cb{background:var(--green);border-color:var(--green)}
.lyr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lyr-tools{display:flex;gap:.25rem;background:var(--ink);border-radius:.55rem;padding:.3rem;margin:.5rem 0 .65rem}
.lyr-tools button{width:1.7rem;height:1.7rem;border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:.35rem;cursor:pointer;font-size:.75rem}
.lyr-tools button:hover{background:var(--green)}
.lyr-tools .sp{margin-left:auto;background:none;color:rgba(255,255,255,.6)}
.mw-vtools{position:absolute;top:.75rem;right:.75rem;display:flex;flex-direction:column;gap:.35rem;z-index:3}
.mw-vtools button{width:2rem;height:2rem;border:1px solid var(--line-2);background:rgba(255,255,255,.96);border-radius:.45rem;cursor:pointer;font-size:.85rem;display:grid;place-items:center;color:var(--muted)}
.mw-vtools button:hover{border-color:var(--green);color:var(--green)}
.mw-vtools .grp{border:0;border-radius:.45rem;overflow:hidden;background:var(--green)}
.mw-vtools .grp button{border:0;border-radius:0;background:var(--green);color:#fff;border-bottom:1px solid rgba(255,255,255,.2)}
.mw-vtools .grp button:hover{background:var(--green-d);color:#fff}
.mw-vtools .grp button:last-child{border-bottom:0}
.mw-locate{position:absolute;top:.75rem;left:50%;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:.55rem;background:#fff;border:1px solid var(--line-2);border-radius:.6rem;padding:.55rem .8rem;font-size:.82rem;color:var(--faint);width:min(420px,60%);box-shadow:var(--shadow-card)}
.mw-mini{position:absolute;bottom:.75rem;left:.75rem;width:96px;height:70px;border:1px solid var(--line-2);background:var(--bg-soft);z-index:3;border-radius:.3rem}
.lcap{border:1px solid var(--line);border-radius:0;background:#fff;overflow:hidden;box-shadow:var(--shadow-card)}
.lcap-h{padding:.7rem .9rem;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--bg-soft);border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
.lcap-block:first-child .lcap-h{border-top:0}
.lcap-row{display:grid;grid-template-columns:repeat(5,1fr)}
.lcap-step{padding:.85rem;font-size:.8rem;line-height:1.5;color:var(--muted);border-left:1px solid var(--line);min-height:104px;cursor:pointer;transition:background .12s}
.lcap-step:first-child{border-left:0}
.lcap-step:hover{background:var(--green-soft)}
.lcap-step b{display:block;font-family:var(--mono);font-size:.66rem;font-weight:700;color:var(--faint);margin-bottom:.35rem;letter-spacing:.05em}
.lcap-step.done b{color:var(--green-d)}
.lcap-step.done{background:var(--green-soft);color:var(--ink)}
@media(max-width:900px){.lcap-row{grid-template-columns:1fr 1fr}.lcap-step{border-top:1px solid var(--line)}}

/* Superset — sign-in + chart explorer */
.sup-login{max-width:760px;margin:0 auto;border:1px solid var(--line);border-radius:0;background:var(--bg-soft);padding:1.6rem}
.sup-login .card{background:#fff;border:1px solid var(--line);border-radius:0;padding:1.6rem 1.9rem 1.9rem}
.sup-login h3{margin:0 0 .25rem;font-size:1.6rem}
.sup-login .rule{border-top:1px solid var(--line);margin:.9rem 0 1.6rem}
.sup-login p{margin:0 0 1.25rem;font-size:.98rem;color:var(--muted)}
.sup-login label{display:block;font-size:.82rem;font-weight:700;color:var(--ink);margin:0 0 .4rem}
.sup-field{display:flex;border:1px solid var(--line-2);border-radius:.6rem;overflow:hidden;margin-bottom:1.1rem;transition:.15s}
.sup-field:focus-within{border-color:var(--green);box-shadow:0 0 0 3px rgba(78,124,89,.12)}
.sup-field .ic{width:3.2rem;background:var(--bg-soft);border-right:1px solid var(--line);display:grid;place-items:center;font-size:.85rem;color:var(--muted-2)}
.sup-field input{flex:1;border:0;outline:0;padding:.7rem .9rem;font:inherit;font-size:.92rem;background:#fff;color:var(--ink)}
.sup{border:1px solid var(--line);border-radius:0;background:#fff;overflow:hidden;box-shadow:var(--shadow-card)}
.sup-top{display:flex;align-items:center;gap:1.35rem;padding:.75rem 1rem;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sup-brand{font-size:1rem;font-weight:800;letter-spacing:-.01em;color:var(--ink)}
.sup-top a{font-size:.85rem;font-weight:600;color:var(--muted);cursor:pointer}
.sup-top a.on{color:var(--green-d);font-weight:700;border-bottom:2px solid var(--green);padding-bottom:.75rem;margin-bottom:-.85rem}
.sup-top .r{margin-left:auto;display:flex;align-items:center;gap:1rem}
.sup-dev{background:var(--green);color:#fff;border-radius:999px;padding:.2rem .75rem;font-size:.72rem;font-weight:700}
.sup-title{display:flex;align-items:center;gap:.9rem;padding:.75rem 1rem;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sup-title h4{margin:0;font-size:1.3rem}
.sup-meta{display:flex;align-items:center;gap:.9rem;background:var(--bg-soft);border-radius:.4rem;padding:.4rem .75rem;font-size:.76rem;color:var(--muted);flex-wrap:wrap}
.sup-body{display:grid;grid-template-columns:250px 300px 1fr;min-height:520px}
@media(max-width:1100px){.sup-body{grid-template-columns:1fr}}
.sup-col{border-right:1px solid var(--line);padding:.9rem}
.sup-col h5{margin:0 0 .65rem;font-size:.9rem;font-weight:800}
.sup-ds{display:flex;align-items:center;gap:.5rem;border:1px solid var(--line-2);border-radius:.4rem;padding:.5rem .65rem;font-size:.8rem;margin-bottom:.75rem}
.sup-ds .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sup-grp{margin-top:1rem}
.sup-grp .gh{display:flex;justify-content:space-between;align-items:center;font-size:.86rem;font-weight:700}
.sup-grp .gs{font-size:.74rem;color:var(--muted-2);margin:.2rem 0 .5rem}
.sup-item{display:flex;align-items:center;gap:.55rem;border:1px solid var(--line);border-radius:.4rem;background:var(--bg-soft);padding:.5rem .65rem;font-size:.8rem;margin-bottom:.35rem}
.sup-item .h{margin-left:auto;color:var(--faint);letter-spacing:-1px}
.sup-tabs{display:flex;border-bottom:1px solid var(--line);margin:-.9rem -.9rem .9rem}
.sup-tabs span{flex:1;text-align:center;padding:.7rem;font-size:.82rem;font-weight:600;color:var(--muted-2);cursor:pointer}
.sup-tabs span.on{color:var(--green-d);font-weight:700;border-bottom:2px solid var(--green)}
.sup-viz{display:flex;align-items:center;gap:.65rem;flex-wrap:wrap;font-size:.85rem}
.sup-viz .pick{display:inline-flex;align-items:center;gap:.45rem;border:1px solid var(--green);color:var(--green-d);border-radius:.4rem;padding:.3rem .65rem;font-weight:700;font-size:.8rem}
.sup-viz .ico{color:var(--faint);font-size:.9rem;cursor:pointer}
.sup-drop{border:1px dashed var(--line-2);border-radius:.4rem;padding:.55rem .7rem;font-size:.78rem;color:var(--faint);margin-top:.4rem;cursor:pointer;transition:.15s}
.sup-drop:hover{border-color:var(--green);background:var(--green-soft);color:var(--green-d)}
.sup-pill{display:flex;align-items:center;gap:.5rem;border:1px solid var(--line-2);border-radius:.4rem;background:var(--bg-soft);padding:.5rem .65rem;font-size:.8rem}
.sup-pill .x{color:var(--faint);cursor:pointer}
.sup-pill .mono{font-family:var(--mono);font-size:.74rem}
.sup-pill .ch{margin-left:auto;color:var(--faint)}
.sup-lab{font-size:.8rem;font-weight:700;margin:.9rem 0 .15rem}
.sup-seg{display:inline-flex;border:1px solid var(--line-2);border-radius:.4rem;overflow:hidden;margin-top:.4rem}
.sup-seg span{padding:.4rem .9rem;font-size:.8rem;cursor:pointer;background:#fff}
.sup-seg span.on{background:var(--green);color:#fff;font-weight:700}
.sup-res{padding:.9rem 1rem;min-width:0}
.sup-resbar{display:flex;justify-content:flex-end;gap:.65rem;margin-bottom:.75rem}
.sup-chip{border:1px solid var(--line-2);border-radius:999px;padding:.25rem .75rem;font-size:.76rem;font-weight:600;color:var(--muted);background:var(--chip)}
.sup-chip.mono{font-family:var(--mono);font-size:.72rem}
.pivot{width:100%;border-collapse:collapse;font-size:.78rem}
.pivot th,.pivot td{border:1px solid var(--line);padding:.45rem .6rem;text-align:right;white-space:nowrap}
.pivot th{background:var(--bg-soft);font-weight:800;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);text-align:left}
.pivot td.v{text-align:right}
.pivot td.name{text-align:left;color:var(--ink);font-weight:600}
.sup-foot{display:flex;gap:1.35rem;border-top:1px solid var(--line);padding:.65rem 1rem;font-size:.8rem;color:var(--muted)}
/* GeoNode resource browser — typed icon cards */
.gnc-bar{display:flex;align-items:center;gap:.9rem;padding:.6rem .75rem;background:var(--bg-soft);border-bottom:1px solid var(--line);font-size:.8rem;color:var(--muted)}
.gnc-bar .r{margin-left:auto;display:flex;align-items:center;gap:.9rem;color:var(--muted)}
.gnc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.9rem;padding:1rem;background:var(--bg-soft)}
@media(max-width:1000px){.gnc-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.gnc-grid{grid-template-columns:1fr}}
.gnc{background:#fff;border:1px solid var(--line);border-radius:0;display:flex;flex-direction:column;cursor:pointer;box-shadow:var(--shadow-card);transition:box-shadow .15s,transform .15s}
.gnc:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.gnc .big{display:grid;place-items:center;min-height:130px;font-size:2.6rem;color:var(--green-d);background:var(--green-soft)}
.gnc .t{display:flex;align-items:center;gap:.5rem;padding:.75rem .75rem 0;font-size:.92rem;font-weight:700;color:var(--ink)}
.gnc .ab{padding:.4rem .75rem .75rem;font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gnc .f{display:flex;align-items:center;justify-content:space-between;padding:.65rem .75rem;border-top:1px solid var(--line);font-size:.76rem;color:var(--muted-2)}

/* Map Studio — GeoNode application chrome */
.gnv{border:1px solid var(--line);border-radius:0;background:#fff;overflow:hidden;box-shadow:var(--shadow-card)}
.gnv-top{display:flex;align-items:center;gap:1rem;padding:.75rem 1rem;border-bottom:1px solid var(--line)}
.gnv-logo{display:flex;align-items:center;gap:.5rem;font-size:.72rem;font-weight:800;letter-spacing:.04em;color:var(--ink)}
.gnv-logo .dot{width:1.5rem;height:1.5rem;border-radius:50%;background:var(--green);color:#fff;border:0;display:grid;place-items:center;font-size:.7rem}
.gnv-logo small{display:block;font-size:.48rem;font-weight:700;color:var(--faint);letter-spacing:.1em}
.gnv-srch{flex:1;max-width:420px;margin:0 auto;display:flex;align-items:center;gap:.55rem;border:1px solid var(--line-2);border-radius:.6rem;padding:.45rem .7rem;font-size:.8rem;color:var(--faint)}
.gnv-auth{display:flex;gap:1rem;font-size:.8rem;font-weight:600;color:var(--muted)}
.gnv-auth span{cursor:pointer}

.ds-m{font-size:.78rem;color:var(--muted-2)}

/* gallery card */
.gcard{background:#fff;border:1px solid var(--line);border-radius:0;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;box-shadow:var(--shadow-card);transition:transform .15s,box-shadow .15s,border-color .15s}
.gcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);border-color:var(--line-2)}
.gcard:hover h4{color:var(--green-d)}
.gcard .gth{min-height:150px;border:none;border-radius:0;border-bottom:1px solid var(--line)}
.gcard .gbody{padding:.9rem 1rem 1rem;display:flex;flex-direction:column;gap:.5rem;flex:1}
.gcard h4{margin:0;font-size:1.02rem;line-height:1.35;transition:color .15s}
.gcard .gm{display:flex;align-items:center;gap:.5rem;font-size:.76rem;color:var(--muted-2);margin-top:auto;padding-top:.55rem;border-top:1px solid var(--line)}

/* url / share bar */
.urlbar{display:flex;align-items:center;gap:.65rem;border:1px solid var(--line-2);border-radius:.6rem;background:var(--bg-soft);padding:.6rem .8rem;font-family:var(--mono);font-size:.76rem;color:var(--muted);overflow:auto;white-space:nowrap}

/* step / wizard for AI report */
.aibox{border:1.5px dashed var(--green-line);border-radius:0;background:var(--green-soft);padding:1rem}
.ailine{display:flex;gap:.65rem;align-items:flex-start;padding:.5rem 0}
.ai-av{width:1.7rem;height:1.7rem;border-radius:.45rem;background:var(--green);color:#fff;display:grid;place-items:center;font-size:.76rem;flex:none}

/* mini table */
.mtable{width:100%;border-collapse:collapse;font-size:.85rem}
.mtable th{text-align:left;font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink);font-weight:800;padding:.7rem .75rem;background:var(--bg-soft);border-bottom:1px solid var(--line-2);white-space:nowrap}
.mtable td{padding:.7rem .75rem;border-bottom:1px solid var(--line);color:var(--ink);vertical-align:middle;font-size:.85rem}
.mtable tr:last-child td{border-bottom:none}
.mtable tbody tr:hover td{background:var(--bg-soft)}
.mtable td b{color:var(--ink);font-weight:700}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:0;background:#fff;box-shadow:var(--shadow-card)}

/* language switcher */
.langw{position:relative;display:inline-flex}
.lang-menu{position:absolute;right:0;top:calc(100% + .6rem);min-width:10rem;background:#fff;border:1px solid var(--line);border-radius:.65rem;box-shadow:var(--shadow-float);padding:.3rem;display:none;z-index:60}
.langw.open .lang-menu{display:block}
.langw .btn.sm{border-color:transparent;color:var(--ink);font-weight:700;background:none;box-shadow:none}
.langw .btn.sm:hover{color:var(--green-d);background:var(--bg-soft)}

/* sitemap tree */
.tree{font-family:var(--mono);font-size:.78rem;color:var(--muted);line-height:2;white-space:pre;overflow-x:auto}
.tree a{color:var(--ink);cursor:pointer;text-decoration:none;border-bottom:1px dotted var(--line-2)}
.tree a:hover{color:var(--green-d);border-bottom-color:var(--green)}

/* comparison split */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
@media(max-width:760px){.compare{grid-template-columns:1fr}}
.legend-sw{display:flex;align-items:center;gap:.45rem;font-size:.76rem;color:var(--muted)}
.legend-sw i{width:14px;height:14px;border-radius:3px;border:1px solid var(--line-2);display:inline-block}

/* blog article */
.art{max-width:760px}
.art-lead{font-size:1.12rem;line-height:1.7;color:var(--muted);margin:0 0 1.4rem}
.art p{font-size:1rem;line-height:1.8;color:var(--ink-2);margin:0 0 1.15rem}
.art h3{font-size:1.5rem;margin:2rem 0 .75rem}
.art h4{font-size:1.15rem;margin:1.5rem 0 .6rem}
.art ul{margin:0 0 1.15rem;padding-left:1.4rem}
.art li{font-size:1rem;line-height:1.8;color:var(--ink-2);margin:.45rem 0}
.art figure{margin:1.6rem 0}
.art figcaption{font-size:.78rem;color:var(--muted-2);margin-top:.55rem;line-height:1.55}
.art blockquote{margin:1.6rem 0;padding:1.25rem 1.5rem;border-left:4px solid var(--green);background:var(--green-soft);font-size:1.15rem;line-height:1.65;color:var(--ink-2);font-weight:500}
.art-meta{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;padding:1rem 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 0 1.6rem}
.art-meta .who{font-size:.9rem;font-weight:700;color:var(--ink)}
.art-meta .when{font-size:.82rem;color:var(--muted-2)}
.art-toc{position:sticky;top:5.75rem}
.art-toc .h{font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:800;margin-bottom:.65rem}
.art-toc a{display:block;font-size:.85rem;font-weight:600;color:var(--muted);padding:.45rem 0 .45rem .8rem;border-left:2px solid var(--line-2);cursor:pointer;transition:.12s}
.art-toc a:hover{color:var(--ink);border-left-color:var(--green-line)}
.art-toc a.on{color:var(--green-d);font-weight:700;border-left-color:var(--green)}
.art-tags{display:flex;flex-wrap:wrap;gap:.5rem;margin:1.6rem 0}
@media(max-width:900px){.art-toc{position:static;margin-bottom:1.25rem}}

/* sign-in modal */
#login-modal{position:fixed;inset:0;z-index:95;display:none}
#login-modal.open{display:flex;align-items:center;justify-content:center;padding:1.5rem}
#login-modal .lm-back{position:absolute;inset:0;background:rgba(20,28,60,.58);backdrop-filter:blur(2px)}
#login-modal .lm-card{position:relative;z-index:2;width:min(28rem,100%);background:#fff;border:0;border-radius:0;box-shadow:var(--shadow-lg);padding:2rem 2rem 1.75rem}
#login-modal h3{margin:0 0 .25rem;font-size:1.6rem}
#login-modal .lm-sub{margin:0 0 1.25rem;font-size:.9rem;color:var(--muted)}
#login-modal .lm-x{position:absolute;top:.85rem;right:.85rem;width:2rem;height:2rem;border-radius:.55rem;border:1px solid var(--line-2);background:#fff;color:var(--muted);cursor:pointer;font-size:.85rem;display:grid;place-items:center}
#login-modal .lm-x:hover{background:var(--bg-soft);color:var(--ink)}
#login-modal .lm-why{display:flex;align-items:flex-start;gap:.6rem;background:var(--amber-soft);border:1px solid var(--amber-line);border-radius:0;padding:.75rem .9rem;font-size:.82rem;color:var(--amber-d);margin-bottom:1.15rem;line-height:1.5}
#login-modal .lm-foot{display:flex;justify-content:space-between;align-items:center;gap:.65rem;margin-top:1rem;font-size:.82rem}
#login-modal .lm-foot a{color:var(--cta);font-weight:700;text-decoration:none;cursor:pointer}
#login-modal .lm-foot a:hover{color:var(--green-d)}
/* full metadata modal */
#meta-modal{position:fixed;inset:0;z-index:96;display:none}
#meta-modal.open{display:flex;align-items:flex-start;justify-content:center;padding:2rem 1.5rem}
#meta-modal .mm-back{position:absolute;inset:0;background:rgba(20,28,60,.58);backdrop-filter:blur(2px)}
#meta-modal .mm-card{position:relative;z-index:2;width:min(880px,100%);max-height:calc(100vh - 4rem);overflow:auto;background:#fff;border:0;border-radius:0;box-shadow:var(--shadow-lg);padding:1.75rem 2rem 2rem}
#meta-modal .mm-x{position:absolute;top:.9rem;right:1rem;width:2rem;height:2rem;border-radius:.55rem;border:1px solid var(--line-2);background:#fff;color:var(--muted);cursor:pointer;font-size:.9rem;display:grid;place-items:center;z-index:3}
#meta-modal .mm-x:hover{background:var(--bg-soft);color:var(--ink)}
#meta-modal h2{margin:0 0 .65rem;font-size:1.6rem;padding-bottom:.75rem;border-bottom:1px solid var(--line)}
.md-sec{color:var(--green-d);font-size:.72rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;margin:1.4rem 0 .5rem;padding-bottom:.4rem;border-bottom:1px solid var(--line)}
.md-row{display:grid;grid-template-columns:190px 1fr;gap:1.15rem;padding:.35rem 0;font-size:.87rem;align-items:start}
.md-row .lab{text-align:right;font-weight:700;color:var(--ink)}
.md-row .val{color:var(--muted);min-width:0;word-break:break-word}
.md-row .val a{color:var(--green-d);font-weight:600;text-decoration:none;cursor:pointer}
.md-row .val a:hover{text-decoration:underline}
.md-row .val ul{margin:0;padding-left:1.15rem}
@media(max-width:640px){.md-row{grid-template-columns:1fr;gap:2px}.md-row .lab{text-align:left}}

/* map mock — a placeholder that actually reads as a map */
.mapmock{position:relative;overflow:hidden;background:#f6f8f4;border:1px solid var(--line);border-radius:0;min-height:300px;cursor:pointer}
.mapmock svg{display:block;width:100%;height:100%;position:absolute;inset:0}
.mm-chip{position:absolute;background:rgba(255,255,255,.95);border:1px solid var(--line-2);border-radius:.4rem;font-size:.68rem;color:var(--muted);padding:.4rem .6rem;z-index:2;line-height:1.5;box-shadow:var(--shadow-card)}
.mm-legend{top:.65rem;left:.65rem;min-width:132px}
.mm-legend b{display:block;font-size:.62rem;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:800;margin-bottom:.3rem}
.mm-legend span{display:flex;align-items:center;gap:.45rem;padding:1px 0;color:var(--ink)}
.mm-legend i{width:11px;height:8px;border-radius:2px;border:1px solid var(--line-2);display:inline-block}
.mm-north{top:.65rem;right:.65rem;width:28px;height:30px;display:grid;place-items:center;font-size:9px;font-weight:800;padding:0;line-height:1.1;color:var(--ink)}
.mm-zoom{right:.65rem;bottom:2.75rem;padding:0;display:flex;flex-direction:column;overflow:hidden}
.mm-zoom button{width:26px;height:26px;border:0;border-bottom:1px solid var(--line-2);background:none;cursor:pointer;font-size:.85rem;color:var(--ink)}
.mm-zoom button:hover{background:var(--green);color:#fff}
.mm-zoom button:last-child{border-bottom:0}
.mm-scale{right:.65rem;bottom:.65rem;font-family:var(--mono);font-size:.6rem;letter-spacing:.02em}
.mm-attr{left:.65rem;bottom:.65rem;font-size:.6rem;color:var(--muted-2);background:rgba(255,255,255,.85);border-color:transparent;box-shadow:none}
.car-slide .mapmock{min-height:330px;border:0}
@media(max-width:820px){.car-slide .mapmock{min-height:210px}}

/* skip link */
.skip{position:absolute;left:-9999px;top:0;z-index:100;background:var(--ink);color:#fff;padding:.65rem 1rem;border-radius:0 0 .5rem 0;font-size:.85rem}
.skip:focus{left:0}

/* mobile navigation */
.nav-toggle{display:none;width:2.4rem;height:2.4rem;border:1px solid var(--line-2);background:#fff;border-radius:.65rem;cursor:pointer;font-size:1rem;line-height:1;color:var(--ink)}
@media(max-width:900px){
  .nav-toggle{display:grid;place-items:center;order:1;margin-left:auto}
  .nav .logo{order:0}
  .nav > a,.nav .langw,.nav .appsw,.nav .profilew{order:2}
  .nav .btn.sm.primary{order:2}
  .nav{flex-wrap:wrap;height:auto;padding:.75rem 0;gap:.6rem}
  .nav ul{display:none;order:5;flex:1 1 100%;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:.5rem;margin-top:.25rem;justify-content:flex-start}
  header.site.open .nav ul{display:flex}
  .nav a.navlink{display:block;padding:.7rem .75rem;border-radius:.6rem}
  .nav a.navlink.active{background:var(--green-soft)}
  .subnav-wrap{top:0;position:static}
}
@media(max-width:640px){.nav ul{display:none}header.site.open .nav ul{display:flex}}
@media(max-width:560px){
  .nav .appsw{display:none}
  .car-slide .ph-img.car-stage{align-items:flex-start;padding-top:52px}
  .car-cap{padding:2.2rem 1.15rem 1rem}
  .car-cap b{font-size:1.15rem}
  .section{padding:1.9rem 0}
  .panel{padding:1.15rem}
  .hero{padding:1.75rem 1.25rem}
  .split .sl,.split .sr{padding:1.5rem 1.25rem}
}
/* collapse inline-styled multi-column grids on small screens */
@media(max-width:820px){.grid[style*="grid-template-columns"]{grid-template-columns:1fr!important;gap:1.25rem!important}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ============================================================
   COMMONS PLATFORM LANGUAGE — warm cream neutrals, flat square
   panels, square controls, rounded feature cards, dotted green bands
   ============================================================ */
body{font-size:16px;line-height:1.6;letter-spacing:0}
h4{font-family:var(--sans);font-weight:700;letter-spacing:0}
.rcard h4,.gcard h4,.rescard h4,.gn-card h4,.gn-body h4,.kcard h4,.stl-card h4,.sup-title h4,.mae-out h4{font-family:var(--serif);font-weight:400}
.ph-img{background:repeating-linear-gradient(45deg,transparent,transparent 11px,rgba(74,66,62,.05) 11px,rgba(74,66,62,.05) 12px),var(--bg-soft);border-color:var(--line-2)}

/* nav — flat until the page scrolls; logo image + wordmark; icon-only chrome */
header.site{box-shadow:none;transition:box-shadow .2s ease}
header.site.scrolled{box-shadow:0 1px 14px -8px rgba(74,66,62,.35)}
.logo{gap:.7rem}
.logo .lg-ic{height:2.9rem;width:auto;display:block;flex:none}
.logo .bt{font-size:1.2rem;font-weight:900;color:var(--green-d);letter-spacing:-.01em;line-height:1}
.logo small{font-size:.62rem;font-weight:700;letter-spacing:.24em;color:var(--cta);margin-top:.2rem}
.nav a.navlink{font-size:.9rem}
.nav .btn.sm.btn-icon,.langw .btn.sm{border:0;background:none;box-shadow:none;color:var(--ink);padding:.25rem;width:auto;height:auto;border-radius:0}
.nav .btn.sm.btn-icon:hover,.langw .btn.sm:hover{background:none;color:var(--green-d)}
.nav .btn.sm.btn-icon svg{width:1.15rem;height:1.15rem}
.nav .profilew-btn{border:0;background:none;padding:0;border-radius:50%}
.nav .profilew-btn:hover,.nav .profilew.open .profilew-btn{box-shadow:none}
.nav .profilew-btn .pw-name,.nav .profilew-btn .pw-cv{display:none}
.nav .profilew-btn .pw-av{width:1.6rem;height:1.6rem;background:var(--ink);font-size:.6rem;transition:background .15s}
.nav .profilew-btn:hover .pw-av,.nav .profilew.open .pw-av{background:var(--green)}
.pw-av{background:var(--green)}
.pw-item{border-radius:0}
.appsw-menu{width:26rem;padding:1.25rem}
.appsw-cols{grid-template-columns:1fr;gap:1.15rem}
.appsw-cols>div+div{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:1.15rem}
.app-grid2,.app-grid1{grid-template-columns:repeat(3,1fr);gap:.35rem}
.app-grid1 .app-tile{flex-direction:column;text-align:center;padding:.7rem .35rem}
.app-ic{background:#fff;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--ink);border-radius:.65rem}
.lang-menu,.dropdown-menu,.dd-opt2,.lpin,.lpin .pico,.pw-step{border-radius:0}

/* buttons — square; outline buttons carry the gold and fill gold on hover */
.btn,.btn.sm,.btn.btn-icon{border-radius:0}
.btn{color:var(--cta);border-color:var(--line-2)}
.btn:hover{background:var(--cta);color:#fff;border-color:var(--cta)}
.btn.primary{background:var(--cta);color:#fff;border-color:transparent;box-shadow:0 8px 18px -8px rgba(212,162,76,.55)}
.btn.primary:hover{background:var(--green);box-shadow:0 12px 26px -8px rgba(78,124,89,.55)}
.btn.link,.btn.link:hover{background:none;border:0;box-shadow:none}
.btn.link{color:var(--cta)}.btn.link:hover{color:var(--green-d)}
.btn.btn-icon{color:var(--muted)}
.btn.btn-icon:hover{background:var(--cta);color:#fff;border-color:var(--cta)}
.odk-link{border-radius:0}

/* surfaces — flat, square, hairline; hover turns the border green and the title gold */
.panel,.card,.rcard,.doc-card,.filters,.qa,.stat,.kpi,.chart-ph,.tblwrap,.gcard,.rescard,.gn-card,.gn-row,.gn-side,.mapwork,.lcap,.sup,.sup-login .card,.gnv,.mae,.ve-stage,.vemap,.region-card,.sheet,.figcard,.stl-card,.gx-hero,.gx-body,.sig-map,.story-stat,.split,.callout,.ctx-row,.inforow,.kcard,.mae-up,.mae-sec,.scrollx,.gnc,.doc-card,.ve-card,.vm-legend,.vm-search,.ve-legend,.ve-loc,.mw-locate,.gnv-loc,.mm-chip,.sheet,.dpage,.searchpanel{box-shadow:none;border-color:var(--line-2)}
.card:hover,.rcard:hover,.gcard:hover,.rescard:hover,.gn-card:hover,.gn-row:hover,.stl-card:hover,.doc-card:hover,.sheet:hover,.gnc:hover,.kcard:hover,.figcard:hover{box-shadow:none;transform:none;border-color:var(--green)}
.card.click:hover h3,.gcard:hover h4,.rescard:hover h4,.gn-card:hover h4,.gn-body h4:hover,.stl-card:hover h4{color:var(--cta)}
.ctx-row{border-radius:0}
.callout{border-color:var(--line-2);border-left:5px solid var(--green)}
.pullquote{background:#fff;border:1px solid var(--line-2);border-left:5px solid var(--green);border-radius:0;padding:1.75rem 2rem}
.chap-num{color:var(--line-2)}
.wf-tl .wf-ic,.tl-node{border-color:var(--line-2)}

/* feature tiles — the one place cards round off and lift */
.mod-tile{border-radius:16px;border-color:var(--line-2);box-shadow:none}
.mod-tile::after{display:none}
.mod-tile:hover{transform:translateY(-2px);box-shadow:0 18px 34px -22px rgba(74,66,62,.4);border-color:var(--line-2)}
.mod-tile:hover h3{color:var(--green)}
.mod-tile.lg{border-radius:16px}
.mod-ic,.mod-tile:hover .mod-ic{background:color-mix(in srgb,var(--green) 12%,#fff);color:var(--green-d);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--green) 22%,#fff);border-radius:.9rem}
.dss-tile.planned{background:var(--bg-soft)}
.lens{border-radius:14px;border-color:var(--line-2);box-shadow:none}
.lens:hover{transform:translateY(-3px);box-shadow:0 22px 40px -26px rgba(74,66,62,.5);border-color:color-mix(in srgb,var(--green) 45%,#fff)}
.lens .lens-ic{border-radius:.9rem;background:color-mix(in srgb,var(--green) 12%,#fff);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--green) 22%,#fff)}
.carousel{border-radius:16px;border-color:var(--line-2);box-shadow:none}
.car-shot{box-shadow:none;border-color:var(--line-2)}
.car-shot:hover{box-shadow:0 18px 34px -22px rgba(74,66,62,.4)}
.car-nav{box-shadow:0 10px 22px -12px rgba(74,66,62,.5)}
.car-cap{background:linear-gradient(to top,rgba(59,53,49,.88),rgba(59,53,49,0))}
.sstep,.pw-step,.flow .node{border-radius:14px;border-color:var(--line-2);box-shadow:none}
.sstep:hover,.pw-step:hover,.flow .node:hover{border-color:color-mix(in srgb,var(--green) 45%,#fff);box-shadow:0 22px 40px -26px rgba(74,66,62,.5)}
.hs,.ic-tile{border-radius:.8rem}

/* hero + section rhythm */
.hero{background:#fff;border:0;border-bottom:1px solid var(--line);padding:3.25rem 0 2.75rem;margin-top:0;box-shadow:none}
.hero h1{font-size:clamp(2.1rem,3.8vw,3rem);line-height:1.1;letter-spacing:-.01em}
.section{padding:44px 0}
.section h2{font-size:1.75rem}
.home-title{font-size:clamp(2.1rem,3.8vw,3rem);line-height:1.1}
.eyebrow{margin-bottom:.9rem}

/* tabs — white pill bar, gold active */
.tabs{background:#fff;border:1px solid var(--line-2);border-radius:999px;padding:.35rem;gap:.3rem}
.tab{padding:.6rem 1.2rem;font-size:.9rem}
.tab:hover{background:none;color:var(--ink)}
.tab.active{background:var(--cta);color:#fff;box-shadow:0 8px 18px -8px rgba(212,162,76,.6)}
.tabs-c{border-bottom:0}

/* forms — square fields, green focus ring */
.wf-in,select.wf-in,textarea.wf-in,.wf-field,.searchfield,.gx-search,.sup-field,.gx-date,.dd-opt2,.gnv-srch,.sup-ds,.sup-item,.sup-pill,.sup-seg,.sup-drop,.sup-viz .pick,.sup-meta{border-radius:0}
.wf-in,.wf-field,.searchfield,.gx-search{border-color:var(--line-2);background:#fff}
.searchfield{box-shadow:none;padding:.75rem 1rem}
.searchfield:focus-within{box-shadow:0 0 0 3px rgba(78,124,89,.12)}
.gx-hero{padding:.5rem}
.gx-hero:hover .gx-search{border-color:var(--green)}
.dropzone{border-radius:0}

/* metrics + tables */
.kpi b,.stat b,.story-stat b{font-size:clamp(1.6rem,2.4vw,2.1rem);letter-spacing:-.03em;color:var(--ink)}
.kpi .k,.stat span{color:var(--muted)}
.mtable th,.pivot th{background:var(--bg-soft)}
.mtable td{color:var(--ink-2)}

/* dark + coloured bands */
.gx-tabs,.gnv-nav,.lyr-tools{background:#3b3531}
.gx-tab.on{border-bottom-color:var(--cta)}
.split .sr,.sig-side{background:linear-gradient(160deg,var(--green) 0%,var(--green-d) 100%)}
.split .sr::before,.sig-side::before{content:'';position:absolute;inset:0;width:auto;height:auto;right:auto;top:auto;pointer-events:none;
  background:radial-gradient(rgba(255,255,255,.12) 1px,transparent 1px);background-size:20px 20px;
  -webkit-mask-image:radial-gradient(ellipse at 20% 0%,#000 10%,transparent 70%);mask-image:radial-gradient(ellipse at 20% 0%,#000 10%,transparent 70%)}
.split .sr .ctx-row{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:14px;transition:background .15s,border-color .15s}
.split .sr .ctx-row:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35)}
.gateway-like,.dtable .tr.th{background:var(--green-d)}
.role-badge{border-radius:999px}

/* chips + status */
