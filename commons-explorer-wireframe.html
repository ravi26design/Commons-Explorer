/* ---------- what's new v2: feature tile + rows ---------- */
.wn-layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:1.5rem;align-items:stretch}
.wn-feature{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:26rem;border-radius:18px;overflow:hidden;background-size:cover;background-position:center;cursor:pointer;box-shadow:0 30px 60px -34px rgba(74,66,62,.6);transition:transform .2s ease,box-shadow .2s ease}
.wn-feature::before{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(43,38,35,.9) 0%,rgba(43,38,35,.45) 45%,rgba(43,38,35,.05) 75%)}
.wn-feature:hover{transform:translateY(-3px);box-shadow:0 36px 70px -34px rgba(74,66,62,.7)}
.wn-feature .wn-kind{position:absolute;left:1.25rem;top:1.25rem;font-size:.68rem;padding:.35rem .75rem}
.wn-ftext{position:relative;z-index:1;padding:1.75rem 1.75rem 1.6rem;color:#fff}
.wn-ftext h3{font-size:clamp(1.4rem,2.2vw,1.9rem);line-height:1.2;color:#fff;margin:0 0 .6rem;max-width:22ch;letter-spacing:-.015em}
.wn-ftext p{font-size:.95rem;line-height:1.6;color:rgba(255,255,255,.85);max-width:44ch;margin:0}
.wn-ftext .wn-meta{border-top:1px solid rgba(255,255,255,.22);padding-top:.9rem;margin-top:1rem;color:rgba(255,255,255,.8)}
.wn-ftext .wn-who{color:#fff}
.wn-ftext .wn-av{background:#fff;color:var(--tc)}
.wn-list{display:flex;flex-direction:column;gap:.85rem}
.wn-row{display:grid;grid-template-columns:8.5rem 1fr auto;gap:1rem;align-items:center;flex:1;padding:.75rem;background:#fff;border:1px solid var(--line-2);border-radius:14px;cursor:pointer;transition:border-color .15s,box-shadow .2s,transform .18s ease}
.wn-row:hover{border-color:color-mix(in srgb,var(--tc) 40%,#fff);box-shadow:0 18px 34px -24px rgba(74,66,62,.45);transform:translateX(3px)}
.wn-thumb{display:block;aspect-ratio:16/11;border-radius:9px;background-size:cover;background-position:center;border:1px solid var(--line)}
.wn-rbody{display:flex;flex-direction:column;gap:.3rem;min-width:0}
.wn-rkind{display:inline-flex;align-items:center;gap:.35rem;font-size:.64rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--tc)}
.wn-rkind .svgi{width:.8rem;height:.8rem}
.wn-row h4{font-family:var(--serif);font-weight:400;font-size:1.05rem;line-height:1.3;margin:0;color:var(--ink);transition:color .15s;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wn-row:hover h4{color:var(--tc)}
.wn-rmeta{display:flex;gap:.6rem;font-size:.76rem;color:var(--muted-2)}
.wn-rmeta .wn-who{font-weight:600;color:var(--ink-2)}
.wn-rmeta .wn-when{margin-left:0}
.wn-rmeta .wn-when::before{content:'·';margin-right:.6rem;color:var(--line-2)}
.wn-go{width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-2);color:var(--faint);font-size:.95rem;transition:.15s}
.wn-row:hover .wn-go{background:var(--tc);border-color:var(--tc);color:#fff;transform:translateX(2px)}
@media(max-width:1000px){.wn-layout{grid-template-columns:1fr}.wn-feature{min-height:20rem}}
@media(max-width:560px){.wn-row{grid-template-columns:6rem 1fr}.wn-go{display:none}.wn-thumb{aspect-ratio:1}}

/* ---------- inner pages: editorial page header ---------- */
.pagehero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:2.5rem;align-items:end;padding:2.75rem 0 2.25rem;border-bottom:1px solid var(--line);margin-bottom:2.25rem}
.pagehero h1{font-size:clamp(2rem,3.4vw,2.75rem);line-height:1.1;letter-spacing:-.015em;margin:0 0 .9rem}
.pagehero h1 em{font-style:normal;color:var(--green)}
.pagehero p{font-size:1.05rem;line-height:1.7;color:var(--muted);max-width:60ch;margin:0}
.ph-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}
.ph-stats>div{background:var(--bg-soft);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem}
.ph-stats b{display:block;font-size:1.7rem;font-weight:800;letter-spacing:-.03em;color:var(--green-d);line-height:1;font-variant-numeric:tabular-nums}
.ph-stats span{display:block;font-size:.78rem;font-weight:600;color:var(--muted-2);margin-top:.35rem;line-height:1.3}
.lens-card .mc-meta{text-transform:none;letter-spacing:0}
@media(max-width:900px){.pagehero{grid-template-columns:1fr;gap:1.5rem;padding:2rem 0 1.75rem}.ph-stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.ph-stats{grid-template-columns:1fr 1fr}}

/* module + lens cards — no icon beside the title */
.mod-tile.comp .mc-body .mod-ic{display:none}
.mod-tile.comp .mc-body .mc-head{gap:0}

/* ---------- header — Understanding Commons pattern ---------- */
.logo{gap:10px}
.logo .mk{width:38px;height:38px;border-radius:11px;background:var(--green);display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 8px 16px -8px rgba(57,162,72,.6)}
.logo .mk .svgi{width:21px;height:21px;stroke-width:2}
.logo .bt{color:var(--ink);font-size:1.05rem;font-weight:800;letter-spacing:-.02em}
.logo small{color:var(--muted-2);letter-spacing:.14em;font-size:.62rem;font-weight:700;margin-top:2px}
.nav ul{gap:1.75rem;justify-content:flex-end}
.navright{display:flex;align-items:center;gap:1.1rem;flex:none;margin-left:.25rem}
.navdiv{width:1px;height:1.6rem;background:var(--line-2);flex:none}
.nav-ic{border:0;background:none;padding:.25rem;color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:color .15s}
.nav-ic:hover{color:var(--green-d)}
.nav-ic .svgi{width:1.3rem;height:1.3rem;stroke-width:2.3}
.nav .btn.sm.btn-icon svg{width:1.3rem;height:1.3rem}
.nav .profilew-btn .pw-av{width:2.1rem;height:2.1rem;background:var(--ink);font-size:.75rem}
.langw .btn.sm{font-size:.92rem;font-weight:600;gap:.35rem}
.langw .btn.sm .svgi{width:.95rem;height:.95rem;color:var(--faint)}
@media(max-width:980px){.navdiv,.langw{display:none}}
@media(max-width:900px){.nav .navright{order:2;margin-left:0}}
@media(max-width:560px){.navright{gap:.75rem}}

/* ---------- header: signed-out profile icon ---------- */
.nav-user .svgi{width:1.75rem;height:1.75rem;color:var(--ink)}
.nav-user:hover .svgi{color:var(--green)}

/* ---------- login: full-page split ---------- */
.loginwrap{display:grid;grid-template-columns:1fr 1.05fr;min-height:100vh;min-height:100dvh;background:#fff}
.lg-form{display:flex;flex-direction:column;justify-content:center;padding:3rem clamp(1.5rem,5vw,4rem);background:#fff}
.lg-inner{width:100%;max-width:25rem;margin:0 auto}
.lg-inner .logo{margin-bottom:2rem;cursor:pointer}
.lg-h1{font-size:2.1rem;letter-spacing:-.02em;margin:0 0 .6rem}
.lg-h1 .wave{display:inline-block;font-size:.9em;margin-left:.15rem}
.lg-sub{font-size:.95rem;line-height:1.6;color:var(--muted);margin:0 0 1.75rem}
.lgf{margin-bottom:1.15rem}
.lgf>label{display:block;font-size:.85rem;font-weight:700;color:var(--ink);margin-bottom:.5rem}
.lg-input{display:flex;align-items:center;gap:.65rem;width:100%;background:var(--bg-soft);border:1px solid transparent;padding:.85rem 1rem;border-radius:0;transition:border-color .15s,background .15s,box-shadow .15s}
.lg-input:focus-within{background:#fff;border-color:var(--green);box-shadow:0 0 0 3px rgba(78,124,89,.12)}
.lg-input input{flex:1;min-width:0;border:0;background:none;outline:none;font:inherit;font-size:.95rem;color:var(--ink)}
.lg-input input::placeholder{color:var(--faint)}
.lg-ic{display:grid;place-items:center;color:var(--muted-2);flex:none}
.lg-ic .svgi{width:1.05rem;height:1.05rem}
.lg-eye{border:0;background:none;padding:0;color:var(--faint);display:grid;place-items:center;flex:none;cursor:pointer}
.lg-eye:hover,.lg-eye.on{color:var(--ink)}
.lg-eye .svgi{width:1.05rem;height:1.05rem}
button.lg-input.dd-btn{justify-content:space-between;font:inherit;font-size:.95rem;font-weight:600;color:var(--ink);text-align:left;cursor:pointer;background:#fff;border:1px solid var(--line-2)}
button.lg-input.dd-btn:hover{border-color:var(--green)}
.lg-inner .dropdown.open .dd-btn{border-color:var(--green);box-shadow:0 0 0 3px rgba(78,124,89,.12)}
button.lg-input.dd-btn #loginRoleField{display:inline-flex;align-items:center;gap:.55rem}
button.lg-input.dd-btn #loginRoleField .svgi{color:var(--green-d)}
button.lg-input.dd-btn .dd-cv{color:var(--faint);width:1rem;height:1rem}
.lg-hint{font-size:.78rem;color:var(--faint);margin-top:.45rem}
.lg-forgot{display:inline-block;font-size:.9rem;font-weight:700;color:var(--cta);cursor:pointer;margin:.15rem 0 1.35rem}
.lg-forgot:hover{color:var(--green-d)}
.lg-btn{padding:.95rem;font-size:1rem;font-weight:700;border-radius:.6rem}
.lg-foot{text-align:center;font-size:.9rem;color:var(--muted);margin-top:1.25rem}
.lg-foot a{color:var(--cta);font-weight:700;cursor:pointer}
.lg-foot a:hover{color:var(--green-d)}
.lg-panel{position:relative;overflow:hidden;padding:3rem clamp(1.5rem,4vw,3.5rem);color:#fff;display:flex;flex-direction:column;justify-content:center;background:var(--green-d)}
.lg-panel::before{content:'';position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.10) 1px,transparent 1px);background-size:22px 22px;-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 75%)}
.lg-close{position:absolute;top:1.25rem;right:1.25rem;z-index:3;width:2.75rem;height:2.75rem;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;cursor:pointer;transition:background .15s}
.lg-close:hover{background:rgba(255,255,255,.26)}
.lg-close .svgi{width:1.15rem;height:1.15rem}
.lg-panel-in{position:relative;z-index:1;width:100%;max-width:30rem;margin:0 auto;text-align:center}
.lg-panel-in h2{color:#fff;font-size:2rem;line-height:1.25;margin:0 0 .85rem}
.lg-panel-in h2 em{color:#dcece0}
.lg-panel-in p{color:rgba(255,255,255,.85);line-height:1.7;margin:0 0 1.75rem;font-size:1.05rem}
.lg-chips{display:flex;flex-wrap:wrap;gap:.55rem;justify-content:center;margin-bottom:1.1rem}
.lg-chip{display:inline-flex;align-items:center;gap:.4rem;background:rgba(255,255,255,.92);color:var(--ink);font-size:.88rem;font-weight:700;padding:.55rem .95rem;box-shadow:0 10px 22px -12px rgba(0,0,0,.5)}
.lg-chip.on{background:#fff;transform:translateY(-4px)}
.lg-chip .svgi{width:.95rem;height:.95rem;color:var(--green-d)}
.lg-card{background:#fff;padding:1.1rem 1.15rem;text-align:left;box-shadow:0 26px 50px -18px rgba(10,20,50,.6)}
.lgc-head{display:flex;align-items:center;gap:.55rem;padding-bottom:.85rem;border-bottom:1px solid var(--line)}
.lgc-head b{flex:1;font-size:.95rem;color:var(--ink)}
.lgc-dot{width:.55rem;height:.55rem;border-radius:50%;background:var(--green);flex:none}
.lgc-badge{font-size:.72rem;font-weight:800;letter-spacing:.04em;color:var(--green-d);background:var(--green-soft);border:1px solid var(--green-line);padding:.25rem .55rem}
.lgc-row{display:flex;align-items:center;gap:.7rem;padding:.7rem 0;border-bottom:1px solid var(--line);font-size:.92rem;color:var(--ink)}
.lgc-row>span:nth-child(2){flex:1}
.lgc-row .ic-tile{width:2.1rem;height:2.1rem;border-radius:50%;flex:none;display:grid;place-items:center}
.lgc-row .ic-tile .svgi{width:1rem;height:1rem}
.lgc-toggle{width:2.4rem;height:1.3rem;border-radius:999px;background:var(--green);position:relative;flex:none}
.lgc-toggle::after{content:'';position:absolute;top:.15rem;right:.15rem;width:1rem;height:1rem;border-radius:50%;background:#fff}
.lgc-foot{display:flex;justify-content:space-between;align-items:baseline;margin-top:.9rem;font-size:.82rem;font-weight:700;color:var(--muted-2)}
.lgc-foot b{color:var(--ink)}
.lgc-bar{height:.35rem;background:var(--line);margin-top:.4rem}
.lgc-bar i{display:block;height:100%;width:100%;background:var(--green)}
@media(max-width:900px){.loginwrap{grid-template-columns:1fr}.lg-panel{display:none}.lg-form{padding:2.5rem 1.25rem}}

.lgc-row .ic-tile{background:var(--green-soft);color:var(--green-d)}
.lgc-row .ic-tile.forest{background:var(--t-forest-s);color:var(--t-forest)}
.lgc-row .ic-tile.water{background:var(--t-water-s);color:var(--t-water)}
.lgc-row .ic-tile.cultural{background:var(--t-cultural-s);color:var(--t-cultural)}

/* pages held back for now — visible in the nav, not clickable */
.nav a.navlink.soon,.nav .nav-user.soon{pointer-events:none;cursor:default}

/* header links — larger and bold */
.nav a.navlink,.nav a.navlink.soon{font-weight:700;color:var(--ink)}
.nav a.navlink:hover{color:var(--green-d)}
.nav a.navlink.active{color:var(--green-d);font-weight:800}

/* tag colour tokens — unique per tag, shared across pages */
:root{
  --c-water:#3d7b8c; --c-forest:#3f6549; --c-bio:#c46a4a; --c-other:#d4a24c;
  --c-browse:#5b6fa8; --c-upload:#7c8b3a;
  --c-atlas:#9a5a8c; --c-village:#b5743a; --c-planned:#8a909a;
  --c-mapstudio:#4a8f86; --c-analytics:#8a6520; --c-gallery:#b8557a;
}

/* what's new v3 — list card, date chip, calmer rows */
.wn-feature{background-position:center 60%}
.wn-feature::before{background:linear-gradient(to top,rgba(43,38,35,.92) 0%,rgba(43,38,35,.5) 40%,rgba(43,38,35,.08) 70%)}
.wn-date{position:absolute;right:1.25rem;top:1.25rem;z-index:1;display:inline-flex;align-items:center;gap:.4rem;font-size:.74rem;font-weight:700;color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(4px);padding:.35rem .7rem;border-radius:999px}
.wn-date .svgi{width:.8rem;height:.8rem}
.wn-ftext .wn-meta .wn-when{display:none}
.wn-list{gap:0;background:#fff;border:1px solid var(--line-2);border-radius:18px;overflow:hidden}
.wn-row{border:0;border-radius:0;border-bottom:1px solid var(--line);padding:1.1rem 1.25rem;transition:background .15s}
.wn-row:last-child{border-bottom:0}
.wn-row:hover{transform:none;box-shadow:none;background:color-mix(in srgb,var(--tc) 5%,#fff)}
.wn-thumb{border-radius:10px;box-shadow:0 6px 14px -8px rgba(74,66,62,.4)}
.wn-row h4{font-size:1.1rem}
.wn-go{border-color:var(--line-2)}

/* what's new band — content aligned to the page container on both sides */
.wn-wrap{padding-left:0;padding-right:0}
@media(max-width:1024px){.wn-wrap{padding-left:0;padding-right:0}}
@media(max-width:700px){.wn-wrap{padding-left:0;padding-right:0}}

/* full-bleed blocks — exclude the scrollbar so left and right gutters match */
:root{--sbw:0px}
.ehero,.hero-photo,.ehero-after,.wn-wrap{width:calc(100vw - var(--sbw));margin-left:calc(50% - 50vw + var(--sbw)/2);margin-right:calc(50% - 50vw + var(--sbw)/2)}

/* what's new band sits flush against the footer */
main{padding-bottom:0}
footer.site{margin-top:0}
.section:has(> .wn-wrap){padding-bottom:0}
.wn-wrap{border-bottom:0}

/* what's new cards — one shared hover for every card */
.wn-card{transition:transform .18s ease,box-shadow .2s ease,border-color .15s}
.wn-card:hover{transform:translateY(-3px);box-shadow:0 22px 40px -26px rgba(74,66,62,.5);border-color:var(--green-line)}
.wn-card:hover h4{color:var(--green-d)}
.wn-card:hover .wn-media{filter:none}

/* ---------- one card hover for the whole prototype ---------- */
.card.click,.rcard,.gcard,.rescard,.gn-card,.gn-row,.stl-card,.doc-card,.sheet,.gnc,.kcard,.figcard,.mod-tile,.mod-tile.comp,.lens,.wn-card,.car-shot,.sstep,.pw-step,.flow .node,.lpin,.role-opt,.dss-tile{
  transition:transform .18s ease,box-shadow .2s ease,border-color .15s}
.card.click:hover,.rcard:hover,.gcard:hover,.rescard:hover,.gn-card:hover,.gn-row:hover,.stl-card:hover,.doc-card:hover,.sheet:hover,.gnc:hover,.kcard:hover,.figcard:hover,.mod-tile:hover,.mod-tile.comp:hover,.lens:hover,.wn-card:hover,.car-shot:hover,.sstep:hover,.pw-step:hover,.flow .node:hover,.role-opt:hover,.dss-tile:hover{
  transform:translateY(-3px);box-shadow:0 22px 40px -26px rgba(74,66,62,.5);border-color:var(--green-line);background-color:#fff}
.card.click:hover h3,.rcard:hover h4,.gcard:hover h4,.rescard:hover h4,.gn-card:hover h4,.gn-row:hover h4,.stl-card:hover h4,.mod-tile:hover h3,.mod-tile.comp:hover h3,.lens:hover b,.wn-card:hover h4,.kcard:hover h4{color:var(--green-d)}
.mod-tile.comp:hover .mc-media::after{opacity:1}
.mod-tile.comp:hover .mod-ic,.lens:hover .lens-ic{background:inherit}

/* ---------- thematic datasets page v2 ---------- */
.pagehero.bare{grid-template-columns:1fr;border-bottom:0;margin-bottom:0;padding:2.75rem 0 2rem}
.pagehero.bare p{max-width:64ch}
.page-photo{position:relative;height:22rem;overflow:hidden;background:#efe9df;width:calc(100vw - var(--sbw));margin-left:calc(50% - 50vw + var(--sbw)/2);margin-right:calc(50% - 50vw + var(--sbw)/2)}
.page-photo img{width:100%;height:100%;object-fit:cover;object-position:center 45%;display:block}
.hstats{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem;max-width:64rem;margin:-3.6rem auto 0;padding:0}
.hstat{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:16px;padding:1.35rem 1.5rem;display:flex;align-items:center;gap:1.1rem;box-shadow:0 24px 44px -26px rgba(0,0,0,.45);transition:transform .18s ease,box-shadow .2s ease}
.hstat::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--green);transform:scaleX(0);transform-origin:left;transition:transform .3s ease}
.hstat{cursor:pointer}
.hstat:hover{transform:translateY(-3px);box-shadow:0 30px 50px -26px rgba(0,0,0,.5)}
.lens-grid3.flash{animation:hstatFlash 1s ease}
@keyframes hstatFlash{0%{box-shadow:0 0 0 4px var(--green-line) inset}100%{box-shadow:0 0 0 0 transparent inset}}
.hstat:hover::after{transform:scaleX(1)}
.hstat .ic-tile{display:grid;place-items:center;flex:none;width:3.4rem;height:3.4rem;border-radius:14px;background:linear-gradient(135deg,#eef5ef,#dcebdf);color:var(--green-d);box-shadow:inset 0 0 0 1px rgba(78,124,89,.14)}
.hstat .ic-tile .svgi{width:1.55rem;height:1.55rem;stroke-width:1.8}
.hstat>div{padding-left:1.1rem;border-left:1px solid var(--line);min-width:0}
.hstat b{display:block;font-size:2rem;font-weight:800;letter-spacing:-.03em;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.hstat b em{font-style:normal;color:var(--green)}
.hstat span{display:block;font-size:.84rem;font-weight:600;color:var(--muted-2);margin-top:.4rem;white-space:nowrap}
.lens-grid3 .mc-media{height:10.5rem}
.lens-grid3 .mod-tile.comp .mc-body h3{font-size:1.3rem}
.mod-tile.comp.wide{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);grid-template-rows:1fr auto}
.mod-tile.comp.wide .mc-media{grid-column:1;grid-row:1 / span 2;height:auto;min-height:16rem}
.mod-tile.comp.wide .mc-body{grid-column:2;grid-row:1;padding:1.6rem 1.75rem 1.25rem}
.mod-tile.comp.wide .mc-body .mc-head{padding-top:0}
.mod-tile.comp.wide .mc-foot{grid-column:2;grid-row:2;margin-top:0}
@media(max-width:980px){.hstats{grid-template-columns:repeat(3,1fr);gap:.75rem;margin-top:-2.5rem;padding:0 .5rem}.hstat{padding:1rem 1.1rem}.hstat b{font-size:1.6rem}.page-photo{height:16rem}}
@media(max-width:700px){.hstats{grid-template-columns:1fr;margin-top:1.25rem}.mod-tile.comp.wide{display:flex;flex-direction:column}.mod-tile.comp.wide .mc-media{min-height:11rem}.mod-tile.comp.wide .mc-body{padding:0 1.2rem 1.2rem}.page-photo{height:13rem}}

.page-photo .photo-credit{top:.8rem;bottom:auto}

.lens-cta{display:flex;justify-content:center;margin-top:2.25rem}
.lens-cta .btn{padding:.85rem 1.75rem;font-size:.95rem}

.pagehero.bare{justify-items:center;text-align:center}
.pagehero.bare .ph-copy{max-width:64rem}
.pagehero.bare p{margin:0 auto}

/* page header copy on an 8-of-12 column grid */
.pagehero.bare .ph-copy{width:calc(100% * 8 / 12);max-width:none;margin:0 auto}
.pagehero.bare p{max-width:none}
@media(max-width:900px){.pagehero.bare .ph-copy{width:100%}}

/* breathing room between the stat tiles and the lens cards */
.hstats{margin-bottom:3.25rem}
@media(max-width:700px){.hstats{margin-bottom:2rem}}

.mc-media .mc-tag:empty{display:none}

/* layer tag colours — unique per tag */
:root{
  --c-groundwater:#2c6e9e; --c-waterbody:#4f9fbd; --c-clart:#6d5aa8;
  --c-biomass:#5f8f3e; --c-potential:#9c7a2e; --c-lulc:#7a6a5a;
  --c-species:#a24a2f; --c-protected:#2f8f6e; --c-habitat:#8b5e3c;
}

.page-photo img{object-position:center 55%}

/* ---------- square cards and images everywhere ---------- */
.card,.rcard,.gcard,.rescard,.gn-card,.gn-row,.stl-card,.doc-card,.sheet,.gnc,.kcard,.figcard,.mod-tile,.mod-tile.comp,.mod-tile.lg,.lens,.wn-card,.wn-feature,.wn-row,.wn-list,.car-shot,.carousel,.sstep,.pw-step,.flow .node,.role-opt,.dss-tile,.hstat,.ph-stats>div,.wn-wrap,.need-photo,.need-photo::after,.pillar-row,.hero-comps a,.lg-card,.mc-media,.wn-media,.wn-thumb,.upd-row .thumb,.ph-img,.mapmock,.imgframe,.page-photo,.hero-photo,.hero-photo img,.need-photo img,.mc-link,.sr-card,.panel,.vemap,.ve-card,.region-card,.ctx-row,.inforow,.mae-up,.mae-sec,.tblwrap,.kpi,.stat,.chart-ph,.doc-prev,.dpage,.dimg,.dvid,.aibox,.urlbar,.dropzone,.callout,.pullquote,.searchpanel,.modal-card,.gx-hero,.gx-body,.lcap,.sup,.gnv,.mae,.ve-stage,.mapwork,.sig-map,.lscape,.lc-ill,.lpin-card,.tpin-card,.vm-legend,.vm-search,.ve-legend,.ve-loc{border-radius:0!important}
img,.mw-mini,.gnv-mini,.ve-mini,.sheet-inset{border-radius:0!important}

footer.site .fname{font-size:1.15rem;font-weight:800;letter-spacing:-.02em;color:var(--ink);margin:0}

.lens-grid3 .lens-card:first-child .mc-media{background-position:center 55%}

.credit-note{color:var(--faint);font-size:.78rem;margin-left:.5rem}

/* ---------- thematic repository — lighter facets, richer rows ---------- */
.repo-title{font-size:1.6rem;margin:0 0 1.25rem}
.gn-side{padding:1.15rem;border-color:var(--line-2)}
.gn-fh b{color:var(--ink);font-size:.72rem}
.facet{margin-bottom:.45rem}
.facet-h{background:#fff;color:var(--ink);border:1px solid var(--line-2);border-radius:0;padding:.65rem .8rem;font-size:.78rem;letter-spacing:.06em;justify-content:space-between;flex-direction:row-reverse;transition:border-color .15s,color .15s,background .15s}
.facet-h:hover{background:var(--bg-soft);color:var(--green-d);border-color:var(--green-line)}
.facet:not(.closed) .facet-h{border-left:3px solid var(--green);color:var(--green-d)}
.facet-h .cv{font-size:.7rem;opacity:.7;transition:transform .15s}
.facet:not(.closed) .facet-h .cv{transform:rotate(90deg)}
.facet-b{padding:.5rem .35rem .35rem}
.gn-head h3{font-size:1.15rem}
.gn-count{font-family:var(--serif);font-size:1.3rem}
.gn-row{grid-template-columns:15rem 1fr;border-color:var(--line-2);margin-bottom:.85rem}
.gn-row .gn-th{min-height:11rem;border-right:1px solid var(--line-2)}
.gn-body{padding:1.1rem 1.25rem 1.1rem}
.gn-body h4{font-size:1.15rem;margin-right:3rem}
.gn-desc{font-size:.88rem;line-height:1.6;color:var(--muted)}
.gn-meta{gap:1.1rem;font-size:.78rem;padding-top:.7rem}
.gn-meta .svgi{width:.85rem;height:.85rem;color:var(--faint)}
.gn-kind{display:inline-flex;align-items:center;gap:.35rem;font-size:.66rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tc);background:color-mix(in srgb,var(--tc) 9%,#fff);border:1px solid color-mix(in srgb,var(--tc) 28%,#fff);border-radius:999px;padding:.25rem .65rem;white-space:nowrap}
.gn-kind::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.gn-act.btn.sm{margin-top:.75rem;align-self:flex-start;color:var(--green-d)}
.gn-act.btn.sm:hover{color:#fff}
.gn-add{width:2rem;height:2rem;border-radius:0;top:.9rem;right:.9rem}
.viewtog{border-radius:0}
@media(max-width:640px){.gn-row{grid-template-columns:1fr}.gn-row .gn-th{border-right:0;border-bottom:1px solid var(--line-2)}}

/* ---------- maps: live basemap chrome + CLART thematic map ---------- */
.car-map{position:relative;min-height:330px;background:#eef0ea;overflow:hidden}
.car-shot .car-map{min-height:330px}
.ph-img.has-map>.car-map{position:absolute;inset:0;min-height:0}
.car-map .lm-canvas{position:absolute;inset:0;z-index:0}
.car-map .leaflet-container{font-family:var(--sans);background:#dfe8ee}
.car-map .mapmock{position:absolute;inset:0;min-height:0;border:0}
.lm-chrome{position:absolute;inset:0;z-index:5;pointer-events:none}
.lm-chrome>*{pointer-events:auto}
.lm-layers{position:absolute;top:.6rem;left:.6rem;width:2.6rem;height:2.6rem;border:0;background:#2f6fb0;color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 12px -4px rgba(0,0,0,.4)}
.lm-layers .svgi{width:1.2rem;height:1.2rem}
.lm-search{position:absolute;top:.6rem;right:.6rem;display:flex;align-items:center;gap:.6rem;width:min(22rem,55%);padding:.55rem .75rem;background:#fff;border:1px solid var(--line-2);font-size:.82rem;color:var(--faint);box-shadow:0 4px 12px -6px rgba(0,0,0,.35)}
.lm-search span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lm-search .svgi{width:1rem;height:1rem;color:var(--ink)}
.lm-zoom{position:absolute;right:.6rem;bottom:1.6rem;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 4px 12px -4px rgba(0,0,0,.4)}
.lm-zoom button{width:2.4rem;height:2.2rem;border:0;border-bottom:1px solid rgba(255,255,255,.25);background:#2f6fb0;color:#fff;font-size:1.1rem;font-weight:700;cursor:pointer}
.lm-zoom button:last-child{border-bottom:0}
.lm-zoom .lm-3d{font-size:.85rem}
.lm-mini{position:absolute;left:.6rem;bottom:1.6rem;width:5.5rem;height:4rem;background:#fff url('assets/map-1.jpg') center/cover;border:2px solid #fff;box-shadow:0 4px 12px -6px rgba(0,0,0,.4)}
.lm-label{position:absolute;left:50%;bottom:1.7rem;transform:translateX(-50%);background:rgba(255,255,255,.92);border:1px solid var(--line-2);font-size:.72rem;font-weight:700;color:var(--ink);padding:.3rem .65rem;white-space:nowrap;max-width:60%;overflow:hidden;text-overflow:ellipsis}
.car-map .leaflet-control-attribution{font-size:.6rem;background:rgba(255,255,255,.75)}
.mw-canvas .lm-chrome,.sheet-map .lm-chrome,.ve-map .lm-chrome{display:none}
.car-map.is-clart{background:#fff;display:flex;align-items:center;justify-content:center;padding:.5rem}
.car-map.is-clart .clart{width:100%;height:100%;max-height:100%;display:block}
.clart .cl-title{font:400 34px/1 var(--sans);fill:#111}
.clart .cl-stat{font:400 17px/1 var(--sans);fill:#111}
.clart .cl-ico{font:700 22px/1 var(--sans);fill:#fff}
.clart .cl-legh{font:700 26px/1 Georgia,serif;fill:#111}
.clart .cl-leg{font:700 19px/1 Georgia,serif;fill:#111}
.clart .cl-tick{font:400 15px/1 var(--sans);fill:#111}
.clart .cl-src{font:400 15px/1 var(--sans);fill:#111}
@media(max-width:820px){.car-shot .car-map{min-height:240px}.lm-search{width:60%}.lm-mini,.lm-label{display:none}}

/* ---------- results toolbar ---------- */
.gn-head{margin-bottom:1.1rem;padding-bottom:.9rem;border-bottom:1px solid var(--line)}
.gn-head h3{font-size:1.25rem}
.gn-tools{gap:.6rem}
.viewtog{border:1px solid var(--line-2);background:var(--bg-soft);padding:.2rem;gap:.2rem;border-radius:0}
.viewtog button{width:2.2rem;height:2.1rem;border:0;border-right:0;background:transparent;color:var(--muted);border-radius:0;display:grid;place-items:center;transition:background .15s,color .15s}
.viewtog button .svgi{width:1rem;height:1rem}
.viewtog button:hover{background:#fff;color:var(--green-d)}
.viewtog button.on{background:var(--green);color:#fff;box-shadow:0 3px 8px -4px rgba(78,124,89,.6)}
.gn-sort{position:relative;display:inline-flex;align-items:center;gap:.5rem;border:1px solid var(--line-2);background:#fff;padding:0 .8rem 0 .85rem;height:2.55rem}
.gn-sort>span{font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.gn-sort select{appearance:none;-webkit-appearance:none;border:0;background:transparent;padding:0 1.4rem 0 0;font:inherit;font-size:.88rem;font-weight:700;color:var(--ink);cursor:pointer;width:auto;box-shadow:none}
.gn-sort select:focus{outline:none;box-shadow:none}
.gn-sort .cv{position:absolute;right:.7rem;width:.95rem;height:.95rem;color:var(--faint);pointer-events:none}
.gn-sort:hover{border-color:var(--green)}
.gn-card .gc-b{gap:.55rem}
.gn-card .gn-kind{font-size:.62rem}

.car-map .leaflet-container{background:#e9eef2}

.car-map.is-image{background-size:cover;background-position:center top;background-color:#fff}

.car-auto{display:none!important}

/* map slides — identical frame for every image */
.car-pane:only-child{max-width:960px}
.car-shot .car-map,.car-shot .car-map.is-image,.car-shot .car-map.is-live,.car-shot .car-map.is-clart{height:30rem;min-height:0;max-height:none}
.car-map.is-image{background-size:cover;background-position:center center}
.car-map.is-clart{padding:0}
@media(max-width:1000px){.car-shot .car-map,.car-shot .car-map.is-image,.car-shot .car-map.is-live,.car-shot .car-map.is-clart{height:22rem}}
@media(max-width:640px){.car-shot .car-map,.car-shot .car-map.is-image,.car-shot .car-map.is-live,.car-shot .car-map.is-clart{height:15rem}}

/* ---------- map-only view ---------- */
.mapfull{position:relative;height:calc(100vh - 5rem);height:calc(100dvh - 5rem);min-height:32rem;overflow:hidden;background:#e9eef2;
  width:calc(100vw - var(--sbw));margin-left:calc(50% - 50vw + var(--sbw)/2);margin-right:calc(50% - 50vw + var(--sbw)/2)}
.mapfull .car-map,.mapfull .car-map.is-image,.mapfull .car-map.is-live,.mapfull .car-map.is-clart{position:absolute;inset:0;height:auto!important;min-height:0;max-height:none}
.mapfull .car-map.is-image{background-size:cover;background-position:center}
.mapfull .car-map.is-clart{background:#fff;display:flex;align-items:center;justify-content:center;padding:1.5rem 1.5rem 3rem}
.mapfull .car-map.is-clart .clart{width:auto;height:100%;max-width:100%}
.mapfull .lm-layers{top:1rem;left:1rem}
.mapfull .lm-search{top:1rem;right:1rem;width:min(26rem,40%)}
.mapfull .lm-zoom{right:1rem;bottom:2.4rem}
.mapfull .lm-mini{display:none}
.mf-bar{position:absolute;left:1rem;bottom:2.4rem;z-index:6;display:flex;align-items:center;gap:.9rem;max-width:min(38rem,calc(100% - 2rem));background:#fff;border:1px solid var(--line-2);box-shadow:0 18px 40px -22px rgba(74,66,62,.5);padding:.8rem 1rem .8rem .8rem}
.mf-back{flex:none;width:2.4rem;height:2.4rem;border:1px solid var(--line-2);background:#fff;color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:.15s}
.mf-back:hover{background:var(--green);border-color:var(--green);color:#fff}
.mf-back .svgi{width:1.1rem;height:1.1rem;transform:rotate(90deg)}
.mf-tx{min-width:0;display:flex;flex-direction:column;gap:.1rem}
.mf-kicker{font-size:.64rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--green-d)}
.mf-tx b{font-family:var(--serif);font-weight:400;font-size:1.15rem;color:var(--ink);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mf-sub{font-size:.78rem;color:var(--muted-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mf-acts{display:flex;gap:.35rem;flex:none;padding-left:.75rem;border-left:1px solid var(--line)}
.mf-acts .nav-ic .svgi{width:1.05rem;height:1.05rem;stroke-width:2}
.mf-nav{position:absolute;left:50%;transform:translateX(-50%);bottom:1rem;z-index:6;display:flex;gap:.45rem;background:rgba(255,255,255,.9);border:1px solid var(--line-2);padding:.45rem .7rem}
.mf-dot{width:9px;height:9px;border-radius:50%;background:var(--line-2);cursor:pointer;transition:.2s}
.mf-dot:hover{background:var(--faint)}
.mf-dot.on{background:var(--green);width:24px;border-radius:5px}
@media(max-width:700px){.mf-bar{left:.6rem;right:.6rem;bottom:3rem;max-width:none}.mf-acts{display:none}.mapfull .lm-search{width:60%}.mf-tx b{font-size:1rem}}
</style>
</head>

/* auto-sliding carousel — SRS §2.1.2 & §2.2.1.2.1 (5 s default, manual dots) */
const CAROUSELS={};
function carousel(id,slides,opts){
  opts=opts||{};
  CAROUSELS[id]={i:0,n:slides.length,timer:null,ms:opts.ms||5000};
  return `<div class="carousel" id="${id}">
    <span class="car-auto">Auto-slide · ${(opts.ms||5000)/1000}s</span>
    <button class="car-nav prev" onclick="carGo('${id}',-1)" aria-label="Previous">‹</button>
    <button class="car-nav next" onclick="carGo('${id}',1)" aria-label="Next">›</button>
    <div class="car-track" id="${id}-track">
      ${slides.map(s=>`<div class="car-slide">
        ${/^assets\//.test(s[3]||'')
          ?`<div class="car-stage car-photo" style="background-image:url('${s[3]}')" onclick="${s[2]||''}"></div>`
          :`<div class="ph-img car-stage" onclick="${s[2]||`toast('Open full map view in the GeoNode viewer')`}">${s[3]||'Map / chart thumbnail'}</div>`}
        <div class="car-cap${s[4]?' hero':''}">${s[4]?`<em class="car-kicker">${s[4]}</em>`:''}<b>${s[0]}</b><span>${s[1]}</span>${s[5]?`<a class="btn primary car-cta" onclick="${s[2]}">${s[5]} →</a>`:''}</div>
      </div>`).join("")}
    </div>
    <div class="car-dots">${slides.map((s,i)=>`<button class="car-dot ${i?'':'on'}" onclick="carSet('${id}',${i})" aria-label="Slide ${i+1}"></button>`).join("")}</div>
  </div>`;
}
function carRender(id){
  setTimeout(()=>LIVEMAPS.forEach(m=>{try{m.invalidateSize()}catch(e){}}),380);
  const c=CAROUSELS[id];if(!c)return;
  const tr=document.getElementById(id+'-track');if(!tr)return;
  tr.style.transform='translateX(-'+(c.i*100)+'%)';
  const dots=document.querySelectorAll('#'+id+' .car-dot');
  dots.forEach((d,i)=>d.classList.toggle('on',i===c.i));
}
function carGo(id,d){const c=CAROUSELS[id];if(!c)return;c.i=(c.i+d+c.n)%c.n;carRender(id);carArm(id);}
function carSet(id,i){const c=CAROUSELS[id];if(!c)return;c.i=i;carRender(id);carArm(id);}
function carArm(id){const c=CAROUSELS[id];if(!c)return;clearInterval(c.timer);c.timer=setInterval(()=>{c.i=(c.i+1)%c.n;carRender(id);},c.ms);}
function carBootAll(){Object.keys(CAROUSELS).forEach(id=>{if(document.getElementById(id)){carRender(id);carArm(id);}else{clearInterval(CAROUSELS[id].timer);delete CAROUSELS[id];}});}

/* a placeholder that reads as a real map: land, water, roads, boundaries, points, labels */
function mapMock(seed,legend){
  seed=seed||1;
  let n=seed*9301+49297;
  const rnd=()=>{n=(n*9301+49297)%233280;return n/233280;};
  let pts="";

/* staged carousel — three labelled map cards per slide (thematic lens) */
function stageCarousel(id,items,ms){
  const per=(arguments.length>3&&arguments[3])?arguments[3]:1;
  const groups=[];
  for(let i=0;i<items.length;i+=per) groups.push(items.slice(i,i+per));
  CAROUSELS[id]={i:0,n:groups.length,timer:null,ms:ms||5000};
  return `<div class="carousel" id="${id}">
    <span class="car-auto">Auto-slide \u00b7 ${(ms||5000)/1000}s</span>
    <button class="car-nav prev" onclick="carGo('${id}',-1)" aria-label="Previous">\u2039</button>
    <button class="car-nav next" onclick="carGo('${id}',1)" aria-label="Next">\u203a</button>
    <div class="car-track" id="${id}-track">
      ${groups.map(g=>`<div class="car-slide"><div class="car-stage3">
        ${g.map((it,gi)=>`<div class="car-pane">
          <div class="car-shot" onclick="${it[2]}">
            <div class="cs-bar"><i></i><i></i><i></i><span>GeoNode map viewer</span></div>
            <div class="car-map" data-seed="${gi+1+groups.indexOf(g)*3}" data-label="${it[0].replace(/"/g,'')}" data-kind="${/clart/i.test(it[0]+' '+it[1])?'clart':/groundwater/i.test(it[0])?'wells':/water body/i.test(it[0])?'villages':''}" data-img="${/clart/i.test(it[0]+' '+it[1])?'assets/water-clart':/groundwater/i.test(it[0])?'assets/water-groundwater':/water body/i.test(it[0])?'assets/water-bodies':''}"></div>
          </div>
          <div class="car-pill">${it[0]}</div>
          <div class="car-sub">${it[1]}</div>
        </div>`).join("")}
      </div></div>`).join("")}
    </div>
    <div class="car-dots">${groups.map((g,i)=>`<button class="car-dot ${i?'':'on'}" onclick="carSet('${id}',${i})" aria-label="Slide ${i+1}"></button>`).join("")}</div>
  </div>`;
}

const GN_AUTHORS=[["FES \u2014 GIS Team","12 Aug 2025","3,140","4"],["Partner CSO","4 Jun 2025","1,956","0"],["Academic partner","18 Mar 2025","603","5"],["Commons Platform","9 Jan 2025","2,204","2"],["FES \u2014 Land Vertical","22 Nov 2024","870","1"],["FES \u2014 Water Vertical","6 Sep 2024","1,412","3"]];
function themeResources(t){
  const out=[];
  t.layers.forEach((l,i)=>out.push({t:l,kind:"Vector Layer",act:"View Map",
    desc:`${l} under the ${t.name} theme \u2014 coverage, source and method of preparation, attribute schema and known limitations.`,a:GN_AUTHORS[i%GN_AUTHORS.length]}));
  t.maps.forEach((m,i)=>out.push({t:m[0],kind:"Map",act:"Create a Map",
    desc:`${m[1]} description of what the map shows, the datasets behind it and how it should be read.`,a:GN_AUTHORS[(i+2)%GN_AUTHORS.length]}));
  out.push({t:`${t.name} \u2014 status and trends, 2019\u20132024`,kind:"Document",act:"Open document",
    desc:`Report summarising the condition of ${t.name.toLowerCase()} commons across the covered geographies, with methodology and caveats.`,a:GN_AUTHORS[2]});
  out.push({t:`${t.name} data dictionary & methodology note`,kind:"Document",act:"Open document",
    desc:"Attribute definitions, classification rules and processing steps for the layers in this lens.",a:GN_AUTHORS[3]});
  return out;
}

      ${facet('Responsibles',['FES \u2014 GIS Team','Partner CSO','Academic partner','Commons Platform'].map(k=>opt(k)).join(''),true)}

function submitUpload(){
  const g=id=>{const e=document.getElementById(id);return e&&e.value?e.value.trim():'';};
  const title=g('up-title')||'Untitled dataset';
  NEW_UPLOADS.unshift(["Dataset",title,(g('up-theme')||'Water')+' · pending file',"31 Aug 2025","Pending"]);
  saveUploads(NEW_UPLOADS);
  toast('Submitted for moderator review');
  go('#/uploads');
}

}

function parseHash(){
  const raw=(location.hash||"#/home").replace(/^#\//,"");
  const [pathPart,queryPart]=raw.split("?");
  const parts=pathPart.split("/").filter(Boolean);
  const params={};
  if(queryPart){queryPart.split("&").forEach(kv=>{const[k,v]=kv.split("=");params[k]=v;});}
  return {parts,params};
}
function render(){
  const {parts,params}=parseHash();
  const name=parts[0]||"home";
  let html;
  if(name==="theme"||name==="mapview"||name==="dataset"||name==="gallery-item"||name==="blog"||name==="lcapmap"||name==="vemap"){params.id=parts[1];params.i=parts[2];html=screens[name](params);}
  else if(name==="resource"){params.id=parts[1];params.i=parts[2];html=screens.resource(params);}
  else if(screens[name]){html=screens[name](params);}
  else{html=screens.home();}
  document.getElementById("app").innerHTML=html;
  window.scrollTo(0,0);
  decoratePlaceholders();
  mountMaps();
  carBootAll();
}
function go(hash){if(location.hash===hash){render();}else{location.hash=hash;}}

}

};
function hashStr(s){let h=7;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;}
function pickImg(pool,key){const a=IMGS[pool]||IMGS.photo;return a[hashStr(key)%a.length];}
function decoratePlaceholders(){
  document.querySelectorAll('.ph-img:not(.has-img)').forEach((el,i)=>{
    const txt=(el.textContent||'').trim().toLowerCase();
    const cls=el.className;
    const key=txt+'|'+cls+'|'+i+'|'+location.hash;
    let pool='photo';
    if(/story|field photo|cover image|photo|illustration|infographic|platform/.test(txt)) pool=/illustration|infographic|platform|cover image/.test(txt)?'ill':'photo';
    if(/map|layer|atlas|extent|geonode|satellite|spring|polygon|village|google earth|mapstore/.test(txt)) pool='map';
    if(/dashboard|chart|table preview|pivot|superset/.test(txt)) pool='chart';
    if(/document|pdf|report/.test(txt)) pool='doc';
    if(/diagram|architecture/.test(txt)) pool='diagram';
    if(/video|film/.test(txt)) pool='video';
    if(/gth|rth|gn-th|gc-th/.test(cls)&&pool==='photo'&&/preview/.test(txt)) pool='map';
    const h=el.getBoundingClientRect().height;
    const big=h>240||/car-stage|mw-canvas|sheet-map|ve-map/.test(cls);
    Array.from(el.childNodes).forEach(n=>{if(n.nodeType===3)n.remove();});
    el.classList.add('has-img');
    if(pool==='map'&&big){el.insertAdjacentHTML('afterbegin',`<div class="car-map" data-seed="${1+hashStr(key)%11}"></div>`);el.classList.add('has-map');mountMaps();}
    else{el.style.backgroundImage='url("'+pickImg(pool,key)+'")';}
  });
}
new MutationObserver(()=>{decoratePlaceholders();mountMaps();}).observe(document.body,{childList:true,subtree:true});

    el.classList.add('mounted');
    if(el.dataset.img){mountMapImage(el,el.dataset.img,['.jpg','.png','.jpeg']);return;}
    const seed=+(el.dataset.seed||1), label=el.dataset.label||'';
    if(el.dataset.kind==='clart'){el.innerHTML=clartMap();el.classList.add('is-clart');return;}
    if(window.L){try{liveMap(el,seed,label,el.dataset.kind||'');el.classList.add('is-live');return;}catch(e){}}
    el.innerHTML=mapMock(seed);
  });
}
window.addEventListener('resize',()=>LIVEMAPS.forEach(m=>{try{m.invalidateSize()}catch(e){}}));

/* ---- BOOT ---- */
try{var _r=localStorage.getItem('ce_role'); if(_r!==null && _r!=='' && ROLES[+_r]){currentRole=+_r;} else if(_r!==null){localStorage.removeItem('ce_role');}}catch(e){}
if(!location.hash) location.hash="#/home";
function boot(){
  try{ render(); }
  catch(err){
    var a=document.getElementById("app");
    if(a) a.innerHTML='<div style="max-width:600px;margin:60px auto;padding:0 24px;font-family:system-ui,-apple-system,sans-serif;color:var(--ink)"><h2>Couldn’t load Commons Explorer</h2><p style="color:var(--muted)">Please hard-refresh the page (Cmd+Shift+R / Ctrl+Shift+R).</p><pre style="white-space:pre-wrap;color:var(--faint);font-size:12px">'+(err&&err.message?err.message:err)+'</pre></div>';
  }
}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",boot);}else{boot();}
</script>
